<style>
  :root{--bg:#ffffff;--panel:#ffffff;--panel2:#f4f6f8;--line:#e3e7ec;--text:#12161c;--muted:#5b6672;--accent:#000;--good:#1f9d55;--danger:#c0392b;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  h1,h2,.display{font-family:'Anton',sans-serif;letter-spacing:1px;text-transform:uppercase;}
  h3{font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  #signin{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#000;padding:24px;
    --panel:#000;--panel2:#0e0e0e;--line:#2a2a2a;--text:#fff;--muted:#b3b3b3;}
  .card{background:#000;border:1px solid #2a2a2a;border-radius:16px;padding:36px 32px;max-width:400px;width:100%;color:#fff;}
  .brand-logo{display:block;width:140px;height:140px;margin:0 auto 14px;object-fit:contain;}
  .brand-sub{text-align:center;font-size:20px;margin:0 0 4px;color:#fff;letter-spacing:2px;font-family:'Anton',sans-serif;}
  .brand-tag{text-align:center;font-size:12px;color:#b3b3b3;letter-spacing:2px;margin-bottom:22px;text-transform:uppercase;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;}
  .field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px;font-family:inherit;}
  .field input:focus,.field select:focus{outline:2px solid #000;}
  #signin .field input:focus{outline:2px solid #fff;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:9px;border:none;font-weight:600;font-size:14px;background:#000;color:#fff;width:100%;}
  #signin .btn{background:#fff;color:#000;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);width:auto;padding:8px 14px;font-size:13px;}
  .btn.small{width:auto;padding:8px 14px;font-size:13px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .signin-footer{text-align:center;margin-top:16px;font-size:13px;color:#b3b3b3;}
  .signin-footer a{color:#fff;cursor:pointer;text-decoration:underline;}
  #app{display:block;min-height:100vh;}
  header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap;}
  .mini-badge{width:40px;height:40px;border-radius:9px;object-fit:contain;background:#000;flex:none;}
  .titlebox{line-height:1.05;} .titlebox .t1{font-size:15px;} .titlebox .t2{font-size:11px;color:var(--muted);letter-spacing:2px;}
  nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;}
  nav.tabs button{background:transparent;border:none;color:var(--muted);padding:9px 13px;border-radius:8px;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;position:relative;}
  nav.tabs button.active{background:#000;color:#fff;}
  .badge{background:#c0392b;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:5px;}
  .user-chip{font-size:13px;color:var(--muted);}
  main{max-width:1100px;margin:0 auto;padding:26px 20px 80px;}
  .section-title{font-size:22px;margin:0 0 4px;} .section-sub{color:var(--muted);font-size:13px;margin:0 0 20px;}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px;}
  .grid{display:grid;gap:14px;} .grid.cols-2{grid-template-columns:1fr 1fr;} .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  @media(max-width:800px){.grid.cols-2,.grid.cols-3{grid-template-columns:1fr;}}
  .cat-tabs{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .cat-tabs button{padding:12px 22px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:14px;}
  .cat-tabs button.on{background:#000;border-color:#000;color:#fff;}
  .cat-tabs button.soon{cursor:not-allowed;color:#8a8f96;background:#f4f6f8;display:inline-flex;align-items:center;gap:10px;}
  .soon-tag{background:#ffd43b;color:#5c4400;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;}
  .chip{display:inline-block;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);font-weight:600;font-size:13px;color:var(--muted);margin:0 6px 6px 0;cursor:pointer;}
  .chip.on{background:#000;border-color:#000;color:#fff;}
  .tag{font-size:11px;padding:3px 9px;border-radius:12px;background:var(--line);color:var(--muted);font-weight:700;white-space:nowrap;display:inline-block;}
  .tag.good{background:#e3f6ea;color:#1f7a45;} .tag.warn{background:#fff3d6;color:#8a6100;} .tag.dark{background:#000;color:#fff;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;} .table-scroll table{min-width:900px;}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;} .empty{color:var(--muted);font-size:13px;padding:20px 0;text-align:center;}
  .row-flex{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);background:#1a1a1a;color:#fff;padding:12px 22px;border-radius:10px;font-weight:600;transition:transform .25s ease;z-index:60;}
  .toast.show{transform:translateX(-50%) translateY(0);}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:70;padding:20px;}
  .modal.open{display:flex;} .modal img{max-width:100%;max-height:90vh;background:#fff;border-radius:8px;}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .step{font-size:11px;padding:3px 9px;border-radius:12px;background:var(--line);color:var(--muted);font-weight:700;}
  .step.done{background:#e3f6ea;color:#1f7a45;}
  .etransfer{background:#000;color:#fff;border-radius:12px;padding:16px 18px;margin:14px 0;}
  .name-alert{background:#ffe3e3;border:4px solid #c0392b;border-radius:14px;padding:20px 22px;margin:16px 0;text-align:center;}
  .name-alert .big{font-family:'Anton',sans-serif;font-size:clamp(24px,5vw,38px);letter-spacing:1px;text-transform:uppercase;line-height:1.15;color:#a80000;}
  .name-alert .deadline{margin-top:12px;padding-top:12px;border-top:3px solid #c0392b;font-weight:700;font-size:clamp(15px,2.6vw,18px);color:#a80000;}
  .name-alert .who{display:inline-block;background:#a80000;color:#fff;border-radius:10px;padding:6px 16px;margin-top:10px;font-size:clamp(20px,4vw,30px);font-weight:800;}
  .contact-note{background:#e8f4ff;border:2px solid #1a6fc4;border-radius:12px;padding:14px 18px;margin:14px 0;font-size:15px;font-weight:600;}
  .etransfer .em{font-size:18px;font-weight:800;letter-spacing:.3px;word-break:break-all;}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>

function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function money(c){ return '$'+(c/100).toFixed(2); }
function stamp(ts){ return ts ? `<div class="hint" style="margin:2px 0 0;font-size:11px;white-space:nowrap;">${new Date(ts).toLocaleString('en-CA',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}</div>` : ''; }
function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
function openModal(src){ document.getElementById('modalImg').src=src; document.getElementById('modal').classList.add('open'); }

/* ================= CATALOG ================= */

const STICK_BRAND_OF = {'Trigger 10 Pro':'CCM','Trigger Unleashed Pro':'CCM','Trigger 9 Pro':'CCM','Vizion':'CCM','Vizion 2':'CCM','XF Ghost':'CCM','FT7 Pro':'CCM','FT8 Pro':'CCM','FT9 Pro':'CCM',
  'Twitch':'Bauer','Proto 2':'Bauer','Proto R':'Bauer','Pulse':'Bauer','Pulse 2':'Bauer','Sling 2':'Bauer','Tracer':'Bauer','Agent':'Bauer','Flylite':'Bauer','Fuse':'Bauer','Hyper 2':'Bauer'};
const STICK_CATALOG = {"Trigger 10 Pro":{"LH":{"P29":["40","50","55","65","70","75"],"P28":["30","40","55","70","75","85","95"]},"RH":{"P29":["30","40","50","55","65"],"P28":["30","40","55","65","75","85"]}},"Trigger Unleashed Pro":{"LH":{"P29":["30","40","50","65","70","75"],"P28":["40","75","85"]},"RH":{"P29":["30","40","55","65"],"P28":["30","40","55","65","85"]}},"Twitch":{"LH":{"P92":["30","40","50","55","70","87"],"P28":["30","40","50","65","70","77","87"]},"RH":{"P92":["30","50","70","87"],"P28":["30","50","55","87"]}},"Vizion":{"LH":{"P29":["70","75","85"],"P28":["70","75"]},"RH":{"P29":["70","75","85"],"P28":["70","75","85"]}},"Vizion 2":{"LH":{"P29":["50","55","65"],"P28":["55","65","70"]},"RH":{"P29":["55","65","70","75"],"P28":["55","65","70","75","85"]}},"XF Ghost":{"LH":{"P29":["55","65","70","75","85"],"P28":["55","65","70","75","85"]},"RH":{"P29":["55","65","70","75","85"],"P28":["70","75","85"]}},"Proto 2":{"LH":{"P92":["30","40","50","55","65","70","77","87"],"P28":["30","55","65","70","77","87"]},"RH":{"P92":["30","40","50","55","70","87"],"P28":["30","55","70","77","87"]}},"Proto R":{"LH":{"P92":["50","65","70","77","87"],"P28":["40","77","87"]},"RH":{"P28":["87"]}},"Pulse":{"LH":{"P92":["30","40","50","55","65","70","77","87","102"],"P28":["30","40","50","55","65","70","77","87","102"]},"RH":{"P92":["50","55","65","70","77","87"],"P28":["50","55","65","70","77","87","102"]}},"Pulse 2":{"LH":{"P92":["70","77","87"],"P28":["70","77","87"]},"RH":{"P92":["70","77"],"P28":["70","77","87"]}},"Sling 2":{"LH":{"P92":["50","55","65","70","102"],"P28":["70","102"]},"RH":{"P92":["40","50","55","65"]}},"Tracer":{"LH":{"P92":["40","50","55","65","70","102"],"P28":["87","102"],"P88":["70","87"]},"RH":{"P92":["40","50","55","65","77","87"],"P28":["70","77","87"]}},"Trigger 9 Pro":{"LH":{"P28":["75","85"]},"RH":{"P28":["85"]}},"Agent":{"LH":{"P92":["40","65","70"],"P28":["50","65"]},"RH":{"P92":["40","50","65"],"P28":["50","55","87"]}},"Flylite":{"LH":{"P92":["30","40","50","55","65","70","77","87","102"],"P28":["40","50","55","65","77","87","102"]},"RH":{"P92":["30","40","50","55","70","77","87"],"P28":["30","50","55","77","87"]}},"FT7 Pro":{"LH":{"P29":["65","70","75"],"P28":["75"]},"RH":{"P29":["65","75","85"],"P28":["75","85"]}},"FT8 Pro":{"LH":{"P29":["30","40","50","55","65","70"],"P28":["30","40","50","70","75"]},"RH":{"P29":["30","40","50","55","65","75"],"P28":["30","40","50","55","65","87","95"]}},"FT9 Pro":{"LH":{"P29":["30","40","50","55","65","70","75","85"],"P28":["30","40","50","70","75","85"]},"RH":{"P29":["30","40","50","55","65"],"P28":["30","40","50","55","70","75","85"]}},"Fuse":{"LH":{"P92":["30","40","55","70","77","87"],"P28":["30","65","70","77","87"]},"RH":{"P92":["30","40","50","55","70","77","87"],"P28":["30","50","55","70","77","87"]}},"Hyper 2":{"LH":{"P28":["87"]},"RH":{"P28":["55","87"]}}};

  { id:'Black & White Reversible', img:'jersey-bw-reversible.png' },
  { id:'Purple & Teal Reversible', img:'jersey-purple-teal-reversible.png' }
];
const JERSEY_SIZES = ['S','M','L','XL','XXL','XXXL'];
// Gloves currently available (all Bauer): model -> colour -> sizes
const GLOVE_CATALOG = {
  'Fuse':    { 'All Black':['13"','14"'] },
  'Flylite': { 'All Black':['11"','12"','13"','14"','15"'] },
  'Mach':    { 'All Black':['11"','12"','13"','14"','15"'], 'Black / Red':['13"','14"','15"'], 'Black / Blue':['13"','14"','15"'] }
};
const SIZE_CHART_URL = 'jersey-size-chart.png';

/* ================= DELIVERY ESTIMATES ================= */
// Supplier lead times in business days (weekends skipped, holidays not). Sticks & gloves share one order date; jerseys have their own.
const LEAD = { sg:{min:10,max:12,label:'Sticks & gloves'}, j:{min:15,max:20,label:'Jerseys'} };
const grp = cat => cat==='Jerseys' ? 'j' : 'sg';
let nextOrderDates = { sg:'', j:'' };       // 'YYYY-MM-DD' — the next date admin sends an order to the supplier
function addBusinessDays(d, n){ const x=new Date(d); let left=n; while(left>0){ x.setDate(x.getDate()+1); const w=x.getDay(); if(w!==0&&w!==6) left--; } return x; }
function fmtDay(d){ return d.toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}); }
function etaRange(base, g){ const b=new Date(base), L=LEAD[g]; return fmtDay(addBusinessDays(b,L.min))+' – '+fmtDay(addBusinessDays(b,L.max)); }
const PAY_DAYS = 3;   // business days to pay before an order is removed
function endOfDay(d){ const x=new Date(d); x.setHours(23,59,59,0); return x; }
function newDeadline(from){ return endOfDay(addBusinessDays(from, PAY_DAYS)); }
function fmtDeadline(d){ return new Date(d).toLocaleDateString('en-CA',{weekday:'long',month:'short',day:'numeric'}); }
function nextOrderLocal(g){ return nextOrderDates[g] ? new Date(nextOrderDates[g]+'T12:00:00') : null; }
function itemEta(i){
  if(i.delivered) return null;
  if(i.in_stock) return 'In stock — ready for pickup/delivery';
  const g=grp(i.category), L=LEAD[g];
  if(i.ordered && i.ordered_at) return 'Estimated delivery: '+etaRange(i.ordered_at,g);
  const n=nextOrderLocal(g);
  return n ? 'Next supplier order: '+fmtDay(n)+' · Estimated delivery: '+etaRange(n,g)
           : `Estimated delivery: ${L.min}–${L.max} business days after we place the supplier order`;
}
function cartEtaText(items){
  const cats=new Set(items.map(x=>grp(x.category))); const lines=[];
  ['sg','j'].forEach(g=>{ if(!cats.has(g)) return; const L=LEAD[g], n=nextOrderLocal(g);
    lines.push(n ? `${L.label}: we place our next supplier order on ${fmtDay(n)}. Estimated delivery ${etaRange(n,g)} (${L.min}–${L.max} business days after ordering).`
                 : `${L.label}: estimated delivery is ${L.min}–${L.max} business days after we place the supplier order.`); });
  return lines.join('\n');
}
async function loadSettings(){
  const { data } = await sb.from('shop_settings').select('*').in('key',['next_order_date','next_order_date_jerseys']);
  nextOrderDates = { sg:'', j:'' };
  (data||[]).forEach(r=>{ if(r.key==='next_order_date') nextOrderDates.sg=r.value||''; if(r.key==='next_order_date_jerseys') nextOrderDates.j=r.value||''; });
}

/* ================= STATE ================= */
let session=null, me=null, authMode='signin';
let tab='shop', shopCat='Sticks';
let cart = [];
let myItems = [];
let adminItems = [], customers = {}, stickInventory = [];
let filterText='', filterStatus='all', lastOrder=null;
let draft = {};
let ordersById = {};
const isAdmin = () => !!(me && (me.is_commissioner || me.is_developer));

function loadCart(){ try{ cart = JSON.parse(localStorage.getItem('obl_cart') || '[]'); }catch(e){ cart=[]; } }
function saveCart(){ try{ localStorage.setItem('obl_cart', JSON.stringify(cart)); }catch(e){} }

/* ================= AUTH ================= */
async function doSignIn(){
  const name=document.getElementById('loginName').value.trim(), password=document.getElementById('loginPass').value;
  if(!name||!password){ setMsg('Enter your name and password.',true); return; }
  setMsg('Signing in…');
  const { data, error } = await sb.auth.signInWithPassword({ email:nameToEmail(name), password });
  if(error){ setMsg('Name or password is incorrect.',true); return; }
  await enterApp(data.session);
}
function showSignIn(){
  if(me){ signOut(); return; }
  document.getElementById('app').style.display='none';
  document.getElementById('signin').style.display='flex';
}
function closeSignIn(){
  document.getElementById('signin').style.display='none';
  document.getElementById('app').style.display='block';
  setMsg('');
}
async function enterApp(sess, silent){
  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', sess.user.id).single();
  if(error || !profile || !(profile.is_commissioner || profile.is_developer)){
    await sb.auth.signOut();
    if(!silent) setMsg('That account does not have admin access.', true);
    return;
  }
  session = sess; me = profile;
  closeSignIn();
  document.getElementById('userName').textContent = me.name || '';
  document.getElementById('adminBtn').textContent = 'Sign Out';
  tab = 'aorders';
  await refreshAdmin();
  render();
}
async function signOut(){
  await sb.auth.signOut(); session=null; me=null;
  adminItems=[]; ordersById={};
  document.getElementById('userName').textContent='';
  document.getElementById('adminBtn').textContent='Admin';
  tab='shop'; render();
}

/* ================= DATA ================= */
async function refreshAdmin(){
  const [it, ord, inv] = await Promise.all([
    sb.from('shop_order_items').select('*').order('created_at',{ascending:false}),
    sb.from('shop_orders').select('*'),
    sb.from('stick_inventory').select('*').order('brand').order('model')
  ]);
  adminItems = it.data || []; stickInventory = inv.data || [];
  await loadSettings();
  ordersById = {}; (ord.data||[]).forEach(o=>ordersById[o.id]=o);
}
function who(i){ const o=ordersById[i.order_id]||{}; return { name:o.customer_name||'?', phone:o.customer_phone||'', email:o.customer_email||'' }; }
/* ================= RENDER ================= */
function tabsList(){
  const t=[['shop','Shop'],['cart','Cart'],['lookup','Find My Order']];
  if(isAdmin()) t.push(['aorders','All Orders'],['toorder','To Order'],['inventory','Inventory'],['customers','Customers'],['admins','Admins']);
  return t;
}
function renderTabs(){
  document.getElementById('tabs').innerHTML = tabsList().map(([id,l])=>`<button class="${tab===id?'active':''}" onclick="goTab('${id}')">${l}${id==='cart'&&cart.length?`<span class="badge">${cart.length}</span>`:''}</button>`).join('');
}
function goTab(id){
  tab=id;
  if(id==='admins') loadAdmins().then(render);
  else if(['aorders','toorder','inventory','customers'].includes(id)) refreshAdmin().then(render);
  else render();

async function placeOrder(){
  csync(); const c=contactDraft;
  if(!cart.length) return;
  if(!c.name.trim()){ showToast('Enter your name'); return; }
  if(c.phone.replace(/\D/g,'').length<10){ showToast('Enter a valid phone number'); return; }
  if(!/^\S+@\S+\.\S+$/.test(c.email.trim())){ showToast('Enter a valid email'); return; }
  const btn=document.getElementById('placeBtn'); btn.disabled=true;
  const note=(document.getElementById('orderNote')||{}).value||null;
  const orderId = crypto.randomUUID();
  const { error } = await sb.from('shop_orders').insert({ id:orderId, customer_name:c.name.trim(), customer_phone:c.phone.trim(), customer_email:c.email.trim(), customer_note:note });
  if(error){ showToast('Order failed: '+error.message); btn.disabled=false; return; }
  const rows = cart.map(x=>({ order_id:orderId, category:x.category, description:x.description, details:{...x.details, note:x.note||undefined}, quantity:x.quantity }));
  const { error:e2 } = await sb.from('shop_order_items').insert(rows);
  if(e2){ showToast('Order failed: '+e2.message); btn.disabled=false; return; }
  lastOrder = { deadline:newDeadline(new Date()), eta:cartEtaText(cart), id:orderId, name:c.name.trim(), phone:c.phone.trim(), email:c.email.trim(), note:note||'', date:new Date(), count:cart.length, total:cartTotal(), items:cart.map(x=>({...x, price:PRICES[x.category]*x.quantity})) }; cart=[]; saveCart(); render();
}

  if(i.category!=='Sticks'||!i.details) return null;

  return stickInventory.find(v=>v.brand===d.brand&&v.model===d.model&&v.hand===d.hand&&v.curve===d.curve&&v.flex===d.flex)||null;
}
async function patchItem(id, patch){
  const { error } = await sb.from('shop_order_items').update(patch).eq('id', id);
  if(error){ showToast('Failed: '+error.message); return false; }
  const it=adminItems.find(x=>x.id===id); if(it) Object.assign(it,patch); return true;
}
async function toggleFlag(id, field){
  const it=adminItems.find(x=>x.id===id); const val=!it[field];
  const patch={ [field]:val }; patch[field+'_at']=val?new Date().toISOString():null;
  if(await patchItem(id,patch)) render();
}
async function setPrice(id, val){
  const v = val.trim()===''? null : Math.round(Number(val)*100);
  if(v!==null && (isNaN(v)||v<0)){ showToast('Enter a valid price'); return; }
  if(await patchItem(id,{ price_cents:v })) { showToast('Price saved'); render(); }
}
async function useStock(id){
  const it=adminItems.find(x=>x.id===id), inv=stickInvFor(it);
  if(!inv||inv.quantity<it.quantity){ showToast('Not enough in stock'); return; }
  const { error } = await sb.from('stick_inventory').update({ quantity:inv.quantity-it.quantity, updated_at:new Date().toISOString() }).eq('id',inv.id);
  if(error){ showToast('Failed: '+error.message); return; }
  inv.quantity-=it.quantity; await patchItem(id,{ in_stock:true }); showToast('Taken from inventory ✓'); render();
}
async function releaseStock(id){
  if(!confirm('Put this stick back into inventory and mark it not in stock?')) return;
  const it=adminItems.find(x=>x.id===id), inv=stickInvFor(it);
  if(inv){ await sb.from('stick_inventory').update({ quantity:inv.quantity+it.quantity, updated_at:new Date().toISOString() }).eq('id',inv.id); inv.quantity+=it.quantity; }
  await patchItem(id,{ in_stock:false }); render();
}
async function deleteItem(id){
  if(!confirm('Delete this order item?')) return;
  const { error } = await sb.from('shop_order_items').delete().eq('id',id);
  if(error){ showToast('Failed: '+error.message); return; }
  adminItems=adminItems.filter(x=>x.id!==id); render();
}
function setFilter(){ filterText=document.getElementById('fText').value; filterStatus=document.getElementById('fStatus').value; render(); }
function orderOf(i){ return ordersById[i.order_id]||{}; }
function isOverdue(i){ const o=orderOf(i); return !i.paid && o.pay_deadline && new Date(o.pay_deadline) < new Date(); }
async function extendOrder(orderId){
  const o=ordersById[orderId]; if(!o) return;
  const base = new Date(Math.max(new Date(o.pay_deadline||0).getTime(), Date.now()));
  const nd = newDeadline(base).toISOString();
  const { error } = await sb.from('shop_orders').update({ pay_deadline:nd }).eq('id',orderId);
  if(error){ showToast('Failed: '+error.message); return; }
  o.pay_deadline=nd; showToast('Extended to '+fmtDeadline(nd)+' ✓'); render();
}
async function removeOrder(orderId){
  const its=adminItems.filter(x=>x.order_id===orderId);
  const nm=(ordersById[orderId]||{}).customer_name||'this customer';
  if(!confirm(`Remove ${nm}'s entire order (${its.length} item${its.length===1?'':'s'})? This can't be undone.`)) return;
  for(const it of its){ if(it.in_stock && it.category==='Sticks'){ const inv=stickInvFor(it); if(inv){ await sb.from('stick_inventory').update({ quantity:inv.quantity+it.quantity, updated_at:new Date().toISOString() }).eq('id',inv.id); inv.quantity+=it.quantity; } } }
  const { error } = await sb.from('shop_orders').delete().eq('id',orderId);
  if(error){ showToast('Failed: '+error.message); return; }
  adminItems=adminItems.filter(x=>x.order_id!==orderId); delete ordersById[orderId]; showToast('Order removed'); render();
}
function filteredItems(){
  const q=filterText.trim().toLowerCase();
  return adminItems.filter(i=>{
    const c=who(i);
    if(q && !((c.name||'').toLowerCase().includes(q) || i.description.toLowerCase().includes(q))) return false;
    if(filterStatus==='overdue' && !isOverdue(i)) return false;
    if(filterStatus==='unpaid' && i.paid) return false;
    if(filterStatus==='notordered' && (i.ordered||i.in_stock)) return false;
    if(filterStatus==='undelivered' && i.delivered) return false;
    if(filterStatus==='open' && i.delivered) return false;
    return true;
  });
}

function groupForSupplier(list){
  const g={};
  list.forEach(i=>{ const k=i.category+'|'+i.description; const nm=who(i).name; (g[k]=g[k]||{category:i.category,description:i.description,qty:0,names:[]}); g[k].qty+=i.quantity; g[k].names.push(i.quantity>1?`${nm} (x${i.quantity})`:nm); });
  return Object.values(g).sort((a,b)=>(a.category+a.description).localeCompare(b.category+b.description));
}
async function downloadOrderList(){
  const list=needsOrdering(); if(!list.length){ showToast('Nothing to order'); return; }
  try{
    if(!window.XLSX){ await new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=res; s.onerror=()=>rej(new Error('Could not load Excel library')); document.head.appendChild(s); }); }
    const data=[['Category','Item','Qty','For']];
    groupForSupplier(list).forEach(g=>data.push([g.category,g.description,g.qty,g.names.join(', ')]));
    data.push([]); data.push(['','Total',list.reduce((a,i)=>a+i.quantity,0),'']);
    const ws=XLSX.utils.aoa_to_sheet(data); ws['!cols']=[{wch:10},{wch:60},{wch:6},{wch:50}];
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'To Order');
    XLSX.writeFile(wb,'OBL-supplier-order-'+new Date().toISOString().slice(0,10)+'.xlsx');
  }catch(e){ showToast('Export failed: '+e.message); return; }
  if(confirm(`Mark these ${list.length} line(s) as ORDERED so they don't appear on the next list?\n\nOK = mark as ordered, Cancel = leave them on the list.`)){
    const now=new Date().toISOString(); const ids=list.map(i=>i.id);
    const { error } = await sb.from('shop_order_items').update({ ordered:true, ordered_at:now }).in('id',ids);
    if(error){ showToast('Failed: '+error.message); return; }
    list.forEach(i=>{ i.ordered=true; i.ordered_at=now; }); showToast('Marked as ordered ✓'); render();
  }
}

function digits(p){ return (p||'').replace(/[^\d+]/g,''); }
let custFrom='', custTo='', custStatus='all';
function setCustFilter(){ custFrom=document.getElementById('cFrom').value; custTo=document.getElementById('cTo').value; custStatus=document.getElementById('cStatus').value; render(); }
function clearCustFilter(){ custFrom=''; custTo=''; custStatus='all'; render(); }
function itemInRange(i){
  const t=new Date(i.created_at).getTime();
  if(custFrom && t < new Date(custFrom+'T00:00:00').getTime()) return false;
  if(custTo && t > new Date(custTo+'T23:59:59').getTime()) return false;
  if(custStatus==='unpaid' && i.paid) return false;
  if(custStatus==='notdelivered' && i.delivered) return false;
  if(custStatus==='ordered' && (!i.ordered || i.delivered)) return false;
  return true;
}
function customerList(){
  const m={};

}

  const existing = allProfiles.find(p=>(p.name||'').toLowerCase().replace(/[^a-z0-9]/g,'')===name.toLowerCase().replace(/[^a-z0-9]/g,''));
  if(existing){ showToast('That name already has a login — use "Make admin" below'); return; }
  const r = await callAdmin('signup',{ name, password:pw });
  if(r.error){ showToast('Failed: '+r.error); return; }
  await loadAdmins();
  const p = allProfiles.find(x=>(x.name||'')===name);
  if(!p){ showToast('Account created, but could not find it — try Make admin below'); render(); return; }
  const { error } = await sb.from('profiles').update({ is_commissioner:true }).eq('id',p.id);
  if(error){ showToast('Account created but admin access failed: '+error.message); return; }
  showToast(`Admin login created for ${name} ✓`); await loadAdmins(); render();
}
async function setAdmin(id, val){
  if(id===me.id && !val){ showToast("You can't remove your own admin access"); return; }
  if(!val && !confirm('Remove admin access for this person?')) return;
  const { error } = await sb.from('profiles').update({ is_commissioner:val }).eq('id',id);
  if(error){ showToast('Failed: '+error.message); return; }
  showToast(val?'Admin access granted ✓':'Admin access removed'); await loadAdmins(); render();
}
let adminSearch='';
async function changeMyPassword(){
  const a=document.getElementById('pwNew').value, b=document.getElementById('pwNew2').value;
  if(a.length<6){ showToast('Password must be at least 6 characters'); return; }
  if(a!==b){ showToast("Passwords don't match"); return; }
  const { error } = await sb.auth.updateUser({ password:a });
  if(error){ showToast('Failed: '+error.message); return; }
  document.getElementById('pwNew').value=''; document.getElementById('pwNew2').value='';
  showToast('Password changed ✓');
}
function renderAdmins(){
  const q=adminSearch.trim().toLowerCase();
  const others=allProfiles.filter(p=>!p.is_commissioner && q && (p.name||'').toLowerCase().includes(q)).slice(0,8);
  return `<h2 class="section-title">Admin Logins</h2>
  <p class="section-sub">Admins can see every order, set prices, update stock, and download the supplier list.</p>
  <div class="panel"><h3 style="margin-top:0;">Change my password</h3>
    <div class="grid cols-3">
      <div class="field"><label>New password</label><input id="pwNew" type="password" autocomplete="new-password" placeholder="at least 6 characters"></div>
      <div class="field"><label>Confirm new password</label><input id="pwNew2" type="password" autocomplete="new-password"></div>
      <div class="field"><label>&nbsp;</label><button class="btn" onclick="changeMyPassword()">Change password</button></div>
    </div></div>
  <div class="panel"><h3 style="margin-top:0;">Create a new admin login</h3>
    <div class="grid cols-3">
      <div class="field"><label>Name (they sign in with this)</label><input id="newAdminName" placeholder="First Last"></div>
      <div class="field"><label>Temporary password</label><input id="newAdminPass" type="text" placeholder="at least 6 characters"></div>
      <div class="field"><label>&nbsp;</label><button class="btn" onclick="createAdminLogin()">Create admin</button></div>
    </div>
    <div class="hint">Give them the name and password. They sign in with the Admin button at the top of this page.</div></div>
  <div class="panel"><h3 style="margin-top:0;">Make an existing player an admin</h3>
    <div class="field"><label>Search by name</label><input id="adminSearch" value="${esc(adminSearch)}" placeholder="Start typing a name" onchange="adminSearch=this.value;render()"></div>
    ${others.map(p=>`<div class="row-flex" style="padding:8px 0;border-top:1px solid var(--line);"><span>${esc(p.name)}</span><button class="btn ghost small" onclick="setAdmin('${p.id}',true)">Make admin</button></div>`).join('') || (q?'<div class="hint">No matches.</div>':'')}</div>
  <div class="panel"><h3 style="margin-top:0;">Current admins (${adminList.length})</h3>
    ${adminList.map(p=>`<div class="row-flex" style="padding:8px 0;border-top:1px solid var(--line);"><span><strong>${esc(p.name)}</strong>${p.is_developer?' <span class="tag dark">developer</span>':''}${p.id===me.id?' <span class="tag">you</span>':''}</span>${p.id===me.id||p.is_developer?'':`<button class="btn ghost small" onclick="setAdmin('${p.id}',false)">Remove admin</button>`}</div>`).join('')}</div>`;
}

/* ================= INIT ================= */
(async function init(){
  loadCart(); render();
  loadSettings().then(render);
  const { data } = await sb.auth.getSession();
  if(data.session){ await enterApp(data.session, true); }
})();
</script>
</body>
</html>
