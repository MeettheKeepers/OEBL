<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBL — Ottawa Beer League</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-icon-precomposed" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OBL">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d12;
    --panel:#121821;
    --panel2:#171f2b;
    --line:#232d3b;
    --teal:#000000;
    --teal-dim:#333333;
    --purple:#000000;
    --purple-dim:#333333;
    --text:#f4f7fa;
    --muted:#93a1b0;
    --danger:#000000;
    --good:#000000;
    --header-bg:rgba(10,13,18,.92);
  }
  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  h1,h2,.display{font-family:'Anton',sans-serif;letter-spacing:1px;text-transform:uppercase;}
  h3{font-family:'Inter',sans-serif;font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
  strong{font-weight:600;}
  a{color:inherit;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  ::selection{background:var(--purple);color:#fff;}

  /* ---------- SIGN IN ---------- */
  #signin{
    min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;
    background:#000000;
    --bg:#000000;--panel:#000000;--panel2:#0e0e0e;--line:#2a2a2a;--text:#ffffff;--muted:#b3b3b3;
    --teal:#4fd1d9;--teal-dim:#2f9aa1;--purple:#8a4fd6;--purple-dim:#6a2fc0;--danger:#e05a5a;--good:#4fd18a;
    padding:24px;
  }
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:36px 32px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  .brand-logo{display:block;width:150px;height:150px;margin:0 auto 18px;object-fit:contain;}
  .brand-title{text-align:center;font-size:26px;line-height:1.05;margin:0 0 2px;color:#fff;}
  .brand-sub{text-align:center;font-size:20px;line-height:1;margin:0 0 6px;color:#fff;letter-spacing:2px;font-family:'Anton',sans-serif;}
  .brand-code{text-align:center;color:var(--muted);font-size:13px;letter-spacing:3px;margin-bottom:22px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;}
  .field input, .field select, .field textarea{
    width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-size:14px;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--teal);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 18px;border-radius:9px;border:none;font-weight:600;font-size:14px;
    background:linear-gradient(90deg,var(--teal-dim),var(--teal));color:#00252a;width:100%;
    transition:transform .1s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn.purple{background:linear-gradient(90deg,var(--purple-dim),var(--purple));color:#fff;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);width:auto;padding:8px 14px;font-size:13px;}
  .btn.small{width:auto;padding:8px 14px;font-size:13px;}
  .btn.danger{background:linear-gradient(90deg,#7a2b2b,var(--danger));color:#fff;}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  .signin-footer{text-align:center;margin-top:16px;font-size:13px;color:var(--muted);}
  .signin-footer a{color:#fff;cursor:pointer;text-decoration:underline;}
  .demo-note{margin-top:22px;font-size:11px;color:var(--muted);text-align:center;max-width:340px;}

  /* ---------- APP SHELL ---------- */
  /* Main app uses a white/light theme with the same teal/purple/black accents;
     sign-in keeps the original dark theme (these vars only override inside #app). */
  #app{
    display:none;min-height:100vh;
    --bg:#ffffff;
    --panel:#ffffff;
    --panel2:#f4f6f8;
    --line:#e3e7ec;
    --text:#12161c;
    --muted:#5b6672;
    --header-bg:rgba(255,255,255,.92);
    background:var(--bg);
    color:var(--text);
  }
  header.top{
    position:sticky;top:0;z-index:20;
    background:var(--header-bg);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:18px;padding:12px 24px;flex-wrap:wrap;
  }
  .mini-badge{width:42px;height:42px;border-radius:9px;object-fit:contain;background:#000;flex:none;}
  .titlebox{line-height:1.05;}
  .titlebox .t1{font-size:16px;color:var(--text);}
  .titlebox .t2{font-size:12px;color:var(--purple);letter-spacing:2px;}
  nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;}
  nav.tabs button{
    background:transparent;border:none;color:var(--muted);padding:9px 14px;border-radius:8px;
    font-size:13px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
  }
  nav.tabs button.active{background:var(--panel2);color:var(--teal);}

  .hamburger-btn{
    flex:none;width:38px;height:38px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;cursor:pointer;transition:border-color .15s ease;
  }
  .hamburger-btn:hover{border-color:var(--teal-dim);}
  .hamburger-btn span{display:block;width:18px;height:2px;background:var(--text);border-radius:2px;transition:transform .2s ease,opacity .2s ease;}
  .hamburger-btn.open{border-color:var(--teal);}
  .hamburger-btn.open span:nth-child(1){transform:translateY(6px) rotate(45deg);}
  .hamburger-btn.open span:nth-child(2){opacity:0;}
  .hamburger-btn.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}
  .menu-dropdown{
    display:none;position:fixed;top:66px;left:16px;width:230px;max-width:calc(100vw - 32px);
    background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    box-shadow:0 16px 40px rgba(0,0,0,.22);max-height:70vh;overflow-y:auto;z-index:31;
  }
  .menu-dropdown.open{display:block;}
  .menu-dropdown button{
    display:block;width:100%;text-align:left;padding:12px 16px;background:transparent;border:none;
    border-bottom:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.3px;
  }
  .menu-dropdown button:last-child{border-bottom:none;}
  .menu-dropdown button:hover{background:var(--panel2);color:var(--text);}
  .menu-dropdown button.active{background:var(--panel2);color:var(--teal);}
  .menu-overlay{position:fixed;inset:0;z-index:29;display:none;background:transparent;}

  .role-toggle{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px;font-size:12px;}
  .role-toggle button{border-radius:16px;padding:6px 12px;background:transparent;color:var(--muted);font-weight:600;}
  .role-toggle button.active{background:var(--purple);color:#fff;}
  .user-chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
  .user-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--good);}

  .chat-icon-btn{
    position:relative;flex:none;width:38px;height:38px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);display:flex;align-items:center;justify-content:center;
    color:var(--text);cursor:pointer;transition:border-color .15s ease;
  }
  .chat-icon-btn:hover{border-color:var(--teal-dim);}
  .chat-dot{
    position:absolute;top:5px;right:5px;width:10px;height:10px;border-radius:50%;
    background:#e05a5a;border:2px solid var(--header-bg);
  }

  nav.league-tabs{
    display:flex;gap:2px;max-width:1080px;margin:0 auto;padding:0 24px;
    border-bottom:1px solid var(--line);
  }
  nav.league-tabs button{
    flex:1;background:transparent;border:none;border-bottom:3px solid transparent;
    padding:12px 10px 10px;color:var(--muted);text-align:center;
  }
  nav.league-tabs button .lg-code{
    display:block;font-family:'Anton',sans-serif;font-size:17px;letter-spacing:1px;color:inherit;
  }
  nav.league-tabs button .lg-name{
    display:block;font-size:10px;letter-spacing:.5px;color:var(--muted);margin-top:2px;text-transform:none;font-weight:600;
  }
  nav.league-tabs button.active{border-bottom-color:var(--teal);}
  nav.league-tabs button.active .lg-code{color:var(--teal);}

  main{max-width:1080px;margin:0 auto;padding:28px 24px 80px;}
  .section-title{font-size:22px;color:var(--text);margin:0 0 4px;}
  .section-sub{color:var(--muted);font-size:13px;margin:0 0 22px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px;}
  .grid{display:grid;gap:16px;}
  .grid.cols-2{grid-template-columns:1fr 1fr;}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:800px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}}

  /* profile */
  .rank-display{font-family:'Anton',sans-serif;font-size:56px;color:var(--teal);line-height:1;}
  input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:4px;background:var(--line);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--teal);border:3px solid #00252a;cursor:pointer;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    padding:9px 16px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);
    font-weight:600;font-size:13px;color:var(--muted);
  }
  .chip.on{background:var(--purple);border-color:var(--purple);color:#fff;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);
    background:#1a1a1a;color:#ffffff;padding:12px 22px;border-radius:10px;font-weight:600;
    transition:transform .25s ease;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .toast.show{transform:translateX(-50%) translateY(0);}

  /* ice times */
  .ice-card{
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;flex-wrap:wrap;
  }
  .ice-date{font-family:'Anton',sans-serif;font-size:15px;color:var(--teal);letter-spacing:1px;}
  .ice-loc{color:var(--muted);font-size:13px;margin-top:2px;}
  .spots-bar{width:120px;height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px;}
  .spots-fill{height:100%;background:linear-gradient(90deg,var(--teal-dim),var(--teal));}
  .tag{font-size:11px;padding:3px 9px;border-radius:12px;background:var(--line);color:var(--muted);font-weight:600;margin-left:6px;white-space:nowrap;display:inline-block;line-height:1.4;}
  .tag.pos{background:rgba(0,0,0,.06);color:var(--purple-dim);}
  .tag.rank{background:rgba(0,0,0,.1);color:var(--teal-dim);}

  /* lines */
  .line-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;}
  .slot{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;}
  .slot .pos-lbl{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:6px;}
  .slot select{width:100%;}
  .slot .name{font-weight:600;font-size:14px;}
  .goalies{display:flex;gap:12px;}
  .goalies .slot{flex:1;}

  /* merch */
  .merch-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
  .merch-img{height:160px;display:flex;align-items:center;justify-content:center;font-size:44px;
    background:linear-gradient(135deg,var(--purple-dim),var(--teal-dim));overflow:hidden;}
  .merch-img img{width:100%;height:100%;object-fit:contain;}
  .listing-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
  .merch-body{padding:14px;flex:1;display:flex;flex-direction:column;}
  .merch-name{font-weight:600;font-size:14px;margin-bottom:2px;}
  .merch-price{color:var(--teal);font-weight:600;margin-bottom:10px;}
  .cart-badge{background:var(--purple);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:6px;}

  /* roster table */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -22px;padding:0 22px;}
  .table-scroll table{min-width:1300px;}

  .player-card{
    background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;
    transition:border-color .1s ease;
  }
  .player-card.selected{border-color:var(--purple);}
  .player-card.unavailable{background:rgba(0,0,0,.08);}
  .player-card .pc-name{font-weight:600;font-size:14px;margin-bottom:6px;}
  .player-card .pc-meta{font-size:12px;color:var(--muted);}

  .empty{color:var(--muted);font-size:13px;padding:20px 0;text-align:center;}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;}
  .row-flex{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
</style>
</head>
<body>

<!-- ============ SIGN IN SCREEN ============ -->
<div id="signin">
  <div class="card">
    <img class="brand-logo" src="icon.png" alt="OBL Hockey">
    <div class="brand-sub">OTTAWA BEER LEAGUE</div>

    <div id="signinForm">
      <div class="field"><label>Name</label><input id="loginName" type="text" placeholder="Jordan Byrne"></div>
      <div class="field"><label>Password</label><input id="loginPass" type="password" placeholder="••••••••"></div>
      <button class="btn" id="authBtn" onclick="doSignIn()">Sign In</button>
      <div id="authMsg" class="hint" style="text-align:center;min-height:16px;"></div>
    </div>

    <div class="signin-footer" id="authToggleRow">New player? <a onclick="toggleAuthMode()">Create account</a></div>
    <div class="demo-note">Sign in with just your name and password. Real accounts — profile, ice-time bookings, and merch are backed by Supabase. Square checkout is still a placeholder.</div>
  </div>
</div>

<!-- ============ MAIN APP ============ -->
<div id="app">
  <header class="top">
    <button type="button" class="hamburger-btn" id="hamburgerBtn" onclick="toggleTabMenu()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <img class="mini-badge" src="icon.png" alt="OBL">
    <div class="titlebox">
      <div class="t1">OTTAWA BEER LEAGUE</div>
      <div class="t2">OBL</div>
    </div>
    <div class="role-toggle" id="roleToggle" style="display:none;margin-left:auto;">
      <button id="roleBtnPlayer" onclick="setRole('player')">Player</button>
      <button id="roleBtnGoalie" onclick="setRole('goalie')" style="display:none;">Goalie</button>
      <button id="roleBtnReferee" onclick="setRole('referee')" style="display:none;">Referee</button>
      <button id="roleBtnAdmin" onclick="setRole('admin')" style="display:none;">Commissioner</button>
    </div>
    <button type="button" class="chat-icon-btn" id="chatIconBtn" onclick="goTab('chat')" aria-label="Chat">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span class="chat-dot" id="chatDot" style="display:none;"></span>
    </button>
    <div class="user-chip"><span class="dot"></span><span id="userName"></span></div>
    <button class="btn ghost small" onclick="signOut()">Sign Out</button>
  </header>

  <div class="menu-dropdown" id="menuDropdown"></div>
  <div class="menu-overlay" id="menuOverlay" onclick="closeTabMenu()"></div>

  <nav class="league-tabs" id="leagueTabs"></nav>
  <main id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

function slugName(name){ return (name||'').toLowerCase().trim().replace(/[^a-z0-9]/g,''); }

// A commissioner with no league_commissioners rows is "global" (full access everywhere).

function isGlobalCommish(){ return !!(me && me.is_commissioner && !(me.commissioner_of && me.commissioner_of.length)); }
function isScopedCommish(){ return !!(me && me.is_commissioner && me.commissioner_of && me.commissioner_of.length); }
function planFor(code){ return (me && me.commissioner_plans && me.commissioner_plans[code||activeLeague]) || 'basic'; }

/* ================= PUSH NOTIFICATIONS ================= */
function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i=0;i<rawData.length;i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}
async function initPush(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    pushStatus = 'unsupported';
    return;
  }
  try{
    swRegistration = await navigator.serviceWorker.register('./sw.js');
    if(Notification.permission === 'denied'){ pushStatus = 'denied'; return; }
    const sub = await swRegistration.pushManager.getSubscription();
    pushStatus = sub ? 'subscribed' : 'not-subscribed';
  }catch(e){
    pushStatus = 'unsupported';
  }
}
async function enablePush(){
  if(pushStatus === 'unsupported'){ showToast('Push notifications are not supported on this device/browser.'); return; }
  try{
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ pushStatus = 'denied'; render(); showToast('Notification permission was not granted.'); return; }
    if(!swRegistration) swRegistration = await navigator.serviceWorker.register('./sw.js');
    const sub = await swRegistration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
    const subJson = sub.toJSON();
    const { error } = await sb.from('push_subscriptions').upsert({
      user_id: me.id,
      endpoint: subJson.endpoint,
      p256dh: subJson.keys.p256dh,
      auth: subJson.keys.auth,
    }, { onConflict:'endpoint' });
    if(error){ showToast('Failed to save subscription: '+error.message); return; }
    pushStatus = 'subscribed';
    render();
    showToast('Notifications enabled ✓');
  }catch(e){
    showToast('Failed to enable notifications: '+e.message);
  }
}
async function disablePush(){
  try{
    if(swRegistration){
      const sub = await swRegistration.pushManager.getSubscription();
      if(sub){
        await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
        await sub.unsubscribe();
      }
    }
    pushStatus = 'not-subscribed';
    render();
    showToast('Notifications disabled');
  }catch(e){
    showToast('Failed: '+e.message);
  }
}

async function loadAllLeagues(){
  // Uses the leagues_public view (id/name/is_private only) — invite_code is never exposed here.
  const { data } = await sb.from('leagues_public').select('*').order('id');
  if(data && data.length){ LEAGUE_META = data; ALL_LEAGUES = data.map(l=>[l.id, l.name]); }
}
async function loadCommissionerScope(){
  me.commissioner_of = [];
  me.commissioner_plans = {};
  if(!me.is_commissioner){ return; }
  const { data } = await sb.from('league_commissioners').select('*').eq('profile_id', me.id);
  (data||[]).forEach(row=>{ me.commissioner_of.push(row.league_id); me.commissioner_plans[row.league_id] = row.plan; });
}
function visibleLeagues(){
  // Global commissioners manage every league. Scoped (independent) commissioners only see
  // their own assigned private league(s), plus any public league they've personally joined.
  // Everyone else only sees the tab(s) for the league(s) they picked on their profile.
  if(isGlobalCommish()) return ALL_LEAGUES;
  if(isScopedCommish()){
    const mine = new Set([...(me.commissioner_of||[]), ...((me.leagues)||[])]);
    return ALL_LEAGUES.filter(([code])=> mine.has(code));
  }
  const mine = (me && me.leagues) || [];
  const filtered = ALL_LEAGUES.filter(([code])=> mine.includes(code));
  return filtered.length ? filtered : publicLeagues();
}
function renderLeagueTabs(){
  const el = document.getElementById('leagueTabs');
  el.innerHTML = visibleLeagues().map(([code,name])=>`
    <button class="${code===activeLeague?'active':''}" onclick="setLeague('${code}')">
      <span class="lg-code">${code}</span><span class="lg-name">${name}</span>
    </button>`).join('');
}

async function loadLeagueData(){

}
async function loadChat(){
  const [{ data: msgs }, { data: lg }] = await Promise.all([
    sb.from('chat_messages').select('*').eq('league_id', activeLeague).order('created_at', { ascending:true }).limit(300),
    sb.from('leagues').select('pinned_message_id').eq('id', activeLeague).maybeSingle(),
  ]);
  chatMessages = msgs || [];
  chatPinnedId = lg ? lg.pinned_message_id : null;
  refreshChatUnread();
}
async function loadDmMessages(){
  const { data } = await sb.from('listing_messages')
    .select('*')
    .eq('league_id', activeLeague)
    .or(`sender_id.eq.${me.id},recipient_id.eq.${me.id}`)
    .order('created_at', { ascending:true })
    .limit(500);
  dmMessages = data || [];
  refreshChatUnread();
}
function refreshChatUnread(){
  chatUnread = computeChatUnread();
  updateChatDot();
}
function computeChatUnread(){
  let leagueUnread = false;
  if(chatMessages.length){
    const last = chatMessages[chatMessages.length-1];
    if(last.user_id!==me.id){
      leagueUnread = !me.chat_last_seen_at || new Date(last.created_at) > new Date(me.chat_last_seen_at);
    }
  }
  const dmUnread = dmMessages.some(m=>m.recipient_id===me.id && !m.read_at);
  return leagueUnread || dmUnread;
}
function updateChatDot(){
  const dot = document.getElementById('chatDot');
  if(dot) dot.style.display = chatUnread ? 'block' : 'none';
}
async function markChatSeen(){
  if(chatMessages.length){
    const last = chatMessages[chatMessages.length-1];
    if(!me.chat_last_seen_at || new Date(last.created_at) > new Date(me.chat_last_seen_at)){
      me.chat_last_seen_at = new Date().toISOString();
      sb.from('profiles').update({ chat_last_seen_at: me.chat_last_seen_at }).eq('id', me.id).then(()=>{}, ()=>{});
    }
  }
  refreshChatUnread();
}
function dmThreads(){
  const map = new Map();
  dmMessages.forEach(m=>{
    const otherId = m.sender_id===me.id ? m.recipient_id : m.sender_id;
    const key = (m.listing_id||'none') + '|' + otherId;
    if(!map.has(key)) map.set(key, { listingId:m.listing_id, listingTitle:m.listing_title, otherId, nameFromMsg:null, messages:[] });
    const t = map.get(key);
    t.messages.push(m);
    if(m.sender_id!==me.id && !t.nameFromMsg) t.nameFromMsg = m.sender_name;
  });
  return Array.from(map.values()).map(t=>{
    const p = playerById(t.otherId);
    return {
      ...t,
      otherName: (p && p.name) || t.nameFromMsg || 'Player',
      last: t.messages[t.messages.length-1],
      unread: t.messages.some(m=>m.recipient_id===me.id && !m.read_at),
    };
  }).sort((a,b)=> new Date(b.last.created_at) - new Date(a.last.created_at));
}
async function markDmThreadRead(t){
  const unreadIds = t.messages.filter(m=>m.recipient_id===me.id && !m.read_at).map(m=>m.id);
  if(!unreadIds.length) return;
  await sb.from('listing_messages').update({ read_at: new Date().toISOString() }).in('id', unreadIds);
  await loadDmMessages();
}

  const { data } = await sb.from('league_reviews').select('*').eq('league_id', activeLeague).order('created_at', { ascending:false });
  leagueReviews = data || [];
}

async function loadListings(){

async function loadAnnouncements(){

function slugifyLeagueCode(name){
  const base = (name||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,6) || 'LEAGUE';
  const suffix = Math.random().toString(36).slice(2,4).toUpperCase();
  return base + suffix;
}
function randomInviteCode(){
  return Math.random().toString(36).slice(2,10).toUpperCase();
}
async function createPrivateLeague(){
  const nameEl = document.getElementById('newLeagueName');
  const commishEl = document.getElementById('newLeagueCommishId');
  const name = (nameEl.value||'').trim();
  const commishId = commishEl.value;
  if(!name){ showToast('Enter a league name'); return; }
  if(!commishId){ showToast('Choose a commissioner'); return; }
  const id = slugifyLeagueCode(name);
  const invite_code = randomInviteCode();
  const { error: leagueErr } = await sb.from('leagues').insert({ id, name, is_private: true, owner_id: commishId, invite_code });
  if(leagueErr){ showToast('Failed: '+leagueErr.message); return; }
  const { error: commishErr } = await sb.from('league_commissioners').insert({ league_id: id, profile_id: commishId, plan: 'basic' });
  if(commishErr){ showToast('Failed: '+commishErr.message); return; }
  const commishPlayer = playerById(commishId);
  const leaguesArr = Array.from(new Set([...(commishPlayer && commishPlayer.leagues || []), id]));
  await sb.from('profiles').update({ is_commissioner: true, leagues: leaguesArr }).eq('id', commishId);
  showToast(`${name} created ✓ — invite code ${invite_code}`);
  await loadRoster();
  await loadAllLeagues();
  await openManageLeagues();
}
async function toggleCommissionerPlan(commissionerRowId, newPlan){
  const { error } = await sb.from('league_commissioners').update({ plan: newPlan, plan_updated_at: new Date().toISOString() }).eq('id', commissionerRowId);
  if(error){ showToast('Failed: '+error.message); return; }
  showToast(`Plan switched to ${newPlan==='pro'?'Pro':'Basic'} ✓`);
  await openManageLeagues();
}

/* ================= DEVELOPER TAB (Kyle + Andrew — review moderation queue) ================= */
async function openDeveloperTab(){
  const { data: reqs } = await sb.from('review_removal_requests').select('*').eq('status','pending').order('created_at');
  removalRequests = reqs || [];
  const leagueIds = removalRequests.filter(r=>r.review_type==='league').map(r=>r.review_id);
  const playerIds = removalRequests.filter(r=>r.review_type==='player').map(r=>r.review_id);
  removalRequestReviews = { league:{}, player:{} };
  if(leagueIds.length){
    const { data } = await sb.from('league_reviews').select('*').in('id', leagueIds);
    (data||[]).forEach(r=> removalRequestReviews.league[r.id] = r);
  }
  if(playerIds.length){
    const { data } = await sb.from('player_reviews').select('*').in('id', playerIds);
    (data||[]).forEach(r=> removalRequestReviews.player[r.id] = r);
  }
  render();
}
function renderDeveloperTab(){
  if(!isDeveloper()) return `<p class="hint">Not available.</p>`;
  return `
  <h2 class="section-title">Developer</h2>
  <p class="section-sub">Tools beyond commissioner access — currently: review removal requests submitted by commissioners.</p>
  <div class="panel">
    <h3 style="margin-top:0;font-size:15px;color:var(--teal)">Pending Removal Requests</h3>
    ${removalRequests.length ? removalRequests.map(req=>{
      const review = req.review_type==='league' ? removalRequestReviews.league[req.review_id] : removalRequestReviews.player[req.review_id];
      const requester = playerById(req.requested_by);
      let context = '<span class="hint">Review no longer exists.</span>';
      if(review){
        if(req.review_type==='league'){
          const author = playerById(review.profile_id);
          context = `${starsHTML(review.rating)} on <strong>${leagueName(review.league_id)}</strong> by ${author?author.name:'?'} — "${(review.review_text||'').replace(/</g,'&lt;')}"`;
        } else {
          const author = playerById(review.reviewer_id);
          const subject = playerById(review.subject_id);
          context = `${starsHTML(review.rating)} on <strong>${subject?subject.name:'?'}</strong> by ${author?author.name:'?'} — "${(review.review_text||'').replace(/</g,'&lt;')}"`;
        }
      }
      return `<div class="panel" style="margin-bottom:10px;">
        <div class="hint" style="margin-bottom:6px;">Requested by ${requester?requester.name:'?'} · ${new Date(req.created_at).toLocaleDateString()}</div>
        <div style="margin-bottom:8px;">${context}</div>
        ${req.reason ? `<div class="hint" style="margin-bottom:8px;">Reason: ${req.reason.replace(/</g,'&lt;')}</div>` : ''}
        <div style="display:flex;gap:6px;">
          <button class="btn purple small" onclick="resolveRemovalRequest('${req.id}','approved','${req.review_type}','${req.review_id}')">Approve — Delete Review</button>
          <button class="btn ghost small" onclick="resolveRemovalRequest('${req.id}','denied',null,null)">Deny</button>
        </div>
      </div>`;
    }).join('') : '<p class="hint">No pending requests.</p>'}
  </div>`;
}
async function resolveRemovalRequest(reqId, status, reviewType, reviewId){
  if(status==='approved' && reviewType && reviewId){
    const table = reviewType==='league' ? 'league_reviews' : 'player_reviews';
    const { error: delErr } = await sb.from(table).delete().eq('id', reviewId);
    if(delErr){ showToast('Failed to delete review: '+delErr.message); return; }
  }
  const { error } = await sb.from('review_removal_requests').update({ status, resolved_at: new Date().toISOString(), resolved_by: me.id }).eq('id', reqId);
  if(error){ showToast('Failed: '+error.message); return; }
  showToast(status==='approved' ? 'Review removed ✓' : 'Request denied');
  await openDeveloperTab();
}
async function requestReviewRemoval(reviewType, reviewId){
  const reason = prompt('Reason for removal (optional):') || null;
  const { error } = await sb.from('review_removal_requests').insert({ review_type: reviewType, review_id: reviewId, requested_by: me.id, reason });
  if(error){ showToast('Failed: '+error.message); return; }
  showToast('Removal request sent to Kyle/Andrew ✓');
}

async function submitOnboardingGate(){
  const phoneEl = document.getElementById('gatePhone');
  const emailEl = document.getElementById('gateEmail');
  const ackEl = document.getElementById('gateAckCheckbox');
  const msgEl = document.getElementById('gateMsg');
  const phoneVal = (phoneEl.value||'').trim();
  const emailVal = (emailEl.value||'').trim();
  if(!phoneVal || !emailVal){
    msgEl.textContent = 'Contact phone and email are both required.';
    return;
  }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)){
    msgEl.textContent = 'Please enter a valid contact email.';
    return;
  }
  if(!ackEl.checked){
    msgEl.textContent = 'Please check the box confirming you have read the terms and conditions.';
    return;
  }
  const payload = { contact_phone: phoneVal, contact_email: emailVal };
  if(!me.rules_acknowledged_at) payload.rules_acknowledged_at = new Date().toISOString();
  const { error } = await sb.from('profiles').update(payload).eq('id', me.id);
  if(error){ msgEl.textContent = 'Save failed: '+error.message; return; }
  me.contact_phone = phoneVal;
  me.contact_email = emailVal;
  if(payload.rules_acknowledged_at) me.rules_acknowledged_at = payload.rules_acknowledged_at;
  showToast('Thanks — you\'re all set ✓');
  activeTab = 'dashboard';
  renderTabs(tabsForRole(role));
  render();
  if(pushStatus==='not-subscribed'){ enablePush(); }
}

/* ---------- RULES ---------- */
function renderRules(){
  const agreement = (leagueRules && leagueRules.content) ? leagueRules.content : '';
  const rules = (leagueRules && leagueRules.rules_content) ? leagueRules.rules_content : '';
  const editBtn = me.is_commissioner
    ? `<button class="btn ghost small" onclick="editingRules=true; render();">Edit</button>`
    : '';
  if(me.is_commissioner && editingRules){
    return `
    <h2 class="section-title">League Agreement and Rules — ${activeLeague}</h2>
    <p class="section-sub">Players see this the first time they sign in, and can always come back to this tab. It's read-only for them.</p>
    <div class="panel" style="margin-bottom:16px;">
      <div class="field"><label>League Agreement</label><textarea id="rulesAgreementInput" rows="12" placeholder="Type the league agreement here...">${agreement}</textarea></div>
    </div>
    <div class="panel">
      <div class="field"><label>Rules</label><textarea id="rulesContentInput" rows="12" placeholder="Type the league rules here...">${rules}</textarea></div>
      <button class="btn purple" onclick="saveRules()">Save</button>
      <button class="btn ghost" onclick="editingRules=false; render();">Cancel</button>
    </div>`;
  }
  const ackHTML = me.rules_acknowledged_at
    ? `<div class="panel" style="margin-top:16px;border-color:var(--good);">

          <span>✓</span>
          <span>Acknowledged on ${new Date(me.rules_acknowledged_at).toLocaleString('en-US',{ month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' })}</span>
        </div>
      </div>`
    : `<div class="panel" style="margin-top:16px;">
        <label style="display:flex;align-items:flex-start;gap:10px;cursor:pointer;">
          <input type="checkbox" id="rulesAckCheckbox" style="width:18px;height:18px;margin-top:2px;flex:none;" onchange="acknowledgeRules(this.checked)">

  <h2 class="section-title" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">League Agreement and Rules — ${activeLeague} ${leagueReviews.length ? `${starsHTML(avgLeagueRating())}<span class="hint">(${leagueReviews.length} review${leagueReviews.length===1?'':'s'})</span>` : `<span class="hint">No reviews yet</span>`}</h2>
  <p class="section-sub">${me.is_commissioner ? 'Visible to all players. Read-only for non-commissioners.' : 'Please read and follow the league agreement and rules below.'}</p>

  <div class="panel" style="margin-bottom:16px;">
    <h3 style="margin-top:0;font-size:15px;color:var(--teal)">Rules</h3>

function avgLeagueRating(){
  if(!leagueReviews.length) return 0;
  return leagueReviews.reduce((a,r)=>a+r.rating,0) / leagueReviews.length;
}
function renderLeagueReviewsHTML(){
  const mine = leagueReviews.find(r=>r.profile_id===me.id);
  const canReview = (me.leagues||[]).includes(activeLeague);
  return `
  <div class="panel" style="margin-top:16px;">
    <h3 style="margin-top:0;font-size:15px;color:var(--teal)">League Reviews ${leagueReviews.length ? starsHTML(avgLeagueRating()) : ''}</h3>
    ${leagueReviews.length ? leagueReviews.map(r=>{
      const author = playerById(r.profile_id);
      return `<div style="padding:10px 0;border-bottom:1px solid var(--line);">
        <div class="row-flex" style="margin-bottom:4px;">
          <strong style="font-size:13px;">${author?author.name:'Player'}</strong>
          <span class="hint">${new Date(r.created_at).toLocaleDateString()}</span>
        </div>
        <div style="margin-bottom:4px;">${starsHTML(r.rating)}</div>
        ${r.review_text ? `<div style="font-size:13px;">${r.review_text.replace(/</g,'&lt;')}</div>` : ''}
        ${me.is_commissioner ? `<button class="btn ghost small" style="margin-top:6px;" onclick="requestReviewRemoval('league','${r.id}')">Request Removal</button>` : ''}
      </div>`;
    }).join('') : `<p class="hint">No reviews yet.</p>`}
    ${canReview ? `
    <div style="margin-top:14px;">
      <label style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;">${mine ? 'Update Your Review' : 'Write a Review'}</label>
      <div class="chips" id="leagueRatingChips" style="margin:8px 0;">
        ${[1,2,3,4,5].map(n=>`<div class="chip ${(mine && mine.rating===n)?'on':''}" data-rating="${n}" onclick="setLeagueReviewRating(${n})">${n}★</div>`).join('')}
      </div>
      <textarea id="leagueReviewText" rows="3" placeholder="Optional — share your experience with this league">${mine ? (mine.review_text||'') : ''}</textarea>
      <button class="btn purple small" style="margin-top:8px;" onclick="submitLeagueReview()">Submit Review</button>
    </div>` : `<p class="hint" style="margin-top:10px;">You can review a league after joining it.</p>`}
  </div>`;
}
let leagueReviewDraftRating = 0;
function setLeagueReviewRating(n){
  leagueReviewDraftRating = n;
  document.querySelectorAll('#leagueRatingChips .chip').forEach(el=>el.classList.toggle('on', Number(el.dataset.rating)===n));
}
async function submitLeagueReview(){
  const mine = leagueReviews.find(r=>r.profile_id===me.id);
  const rating = leagueReviewDraftRating || (mine ? mine.rating : 0);
  if(!rating){ showToast('Pick a star rating first'); return; }
  const review_text = document.getElementById('leagueReviewText').value.trim() || null;
  const { error } = await sb.from('league_reviews').upsert({ league_id: activeLeague, profile_id: me.id, rating, review_text, updated_at: new Date().toISOString() }, { onConflict: 'league_id,profile_id' });
  if(error){ showToast('Failed: '+error.message); return; }
  showToast('Review saved ✓');
  leagueReviewDraftRating = 0;
  await loadLeagueReviews();
  render();
}
async function acknowledgeRules(checked){
  if(!checked) return;
  const ts = new Date().toISOString();
  const { error } = await sb.from('profiles').update({ rules_acknowledged_at: ts }).eq('id', me.id);
  if(error){ showToast('Failed to save acknowledgment: '+error.message); return; }
  me.rules_acknowledged_at = ts;
  showToast('Thanks — your acknowledgment has been recorded ✓');
  render();
}
async function saveRules(){
  const content = document.getElementById('rulesAgreementInput').value;
  const rules_content = document.getElementById('rulesContentInput').value;
  const { error } = await sb.from('league_rules').upsert({ league_id: activeLeague, content, rules_content, updated_at: new Date().toISOString() }, { onConflict: 'league_id' });
  if(error){ showToast('Failed to save: '+error.message); return; }
  leagueRules = { league_id: activeLeague, content, rules_content };
  editingRules = false;
  showToast('Saved ✓');
  render();
}

/* ---------- ANNOUNCEMENTS ---------- */
function renderAnnouncements(){
  const compose = me.is_commissioner ? `
    <div class="panel" style="margin-bottom:16px;">
      <h3 style="margin-top:0;font-size:15px;color:var(--teal)">Post an Announcement</h3>
      <div class="field" style="max-width:220px;"><label>Audience</label>
        <select id="announceAudience"><option value="all">Everyone</option><option value="referees">Referees Only</option></select>
      </div>
      <div class="field"><label>Message</label><textarea id="announceMsg" rows="3" placeholder="e.g. Reminder: game Tuesday 7pm at Rockland — see you there!"></textarea></div>
      <button class="btn purple" onclick="postAnnouncement()">Post &amp; Notify</button>
      <div class="hint">Also sends a push notification to anyone who's enabled notifications. Messages auto-clear after 2 weeks.</div>
    </div>` : '';
  const visible = announcements.filter(a=> a.audience!=='referees' || me.is_commissioner || (me.positions||[]).includes('REF'));
  const list = visible.length ? visible.map(a=>`
    <div class="panel" style="margin-bottom:10px;">
      <div class="row-flex" style="margin-bottom:4px;">
        <strong>${a.author_name}${a.audience==='referees'?' <span class="tag pos">Referees Only</span>':''}</strong>
        <span class="hint">${new Date(a.created_at).toLocaleString('en-US',{ month:'short', day:'numeric', hour:'numeric', minute:'2-digit' })}</span>
      </div>
      <div>${(a.message||'').replace(/</g,'&lt;')}</div>
      ${me.is_commissioner ? `<button class="btn ghost small" style="margin-top:8px;" onclick="deleteAnnouncement('${a.id}')">Delete</button>` : ''}
    </div>`).join('') : '<div class="empty">No announcements yet.</div>';
  return `
  <h2 class="section-title">Announcements — ${activeLeague}</h2>
  <p class="section-sub">Updates and reminders from the commissioner for ${leagueName()}.</p>
  ${compose}
  ${list}`;
}
async function postAnnouncement(){
  const message = document.getElementById('announceMsg').value.trim();
  if(!message){ showToast('Enter a message first'); return; }
  const audienceEl = document.getElementById('announceAudience');
  const audience = audienceEl ? audienceEl.value : 'all';
  const { error } = await sb.from('announcements').insert({ league_id:activeLeague, author_id:me.id, author_name:me.name, message, audience });
  if(error){ showToast('Failed: '+error.message); return; }
  showToast('Posted ✓ — sending notifications…');
  await loadAnnouncements();
  render();
  const pushArgs = { message, title: 'OBL Hockey Message' };
  if(audience==='referees') pushArgs.user_ids = refereeRoster().map(p=>p.id);
  const result = await callAdmin('send-push', pushArgs);
  if(result.error){ showToast('Posted, but push failed: '+result.error); }
  else { showToast(`Notified ${result.sent} device(s) ✓`); }
}
async function deleteAnnouncement(id){
  if(!confirm('Delete this announcement?')) return;
  const { error } = await sb.from('announcements').delete().eq('id', id);
  if(error){ showToast('Failed: '+error.message); return; }
  await loadAnnouncements();
  render();
  showToast('Deleted ✓');
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(){
  const today = new Date(); today.setHours(0,0,0,0);
  const weekOut = new Date(today); weekOut.setDate(weekOut.getDate()+7);
  const upcoming = iceTimes
    .filter(it=>{
      if(!it.game_date) return false;
      const d = new Date(it.game_date+'T00:00:00');
      return d >= today && d <= weekOut;
    })
    .sort((a,b)=> (a.game_date||'').localeCompare(b.game_date||''));

  const myStats = allStats.filter(s=>s.player_id===me.id && iceTimes.some(it=>it.id===s.game_id));
  const totalGoals = myStats.reduce((a,s)=>a+s.goals,0);
  const totalAssists = myStats.reduce((a,s)=>a+s.assists,0);

  return `
  <h2 class="section-title">Dashboard — ${activeLeague}</h2>
  <p class="section-sub">Your snapshot for ${leagueName()}.</p>
  <div class="grid cols-2">
    <div class="panel">
      <h3 style="margin-top:0;font-size:15px;color:var(--teal)">My Profile</h3>
      <div style="font-size:18px;font-weight:600;margin-bottom:6px;">${me.name}</div>
      <div class="hint" style="margin-bottom:10px;">Skill Level: <span class="tag rank">${skillLevelLabel(me.skill_level)}</span></div>
      <div class="chips">${(me.positions||[]).length ? me.positions.map(p=>`<span class="tag pos">${p}</span>`).join('') : '<span class="hint">No positions set yet</span>'}</div>
      <div class="hint" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line);">
        Season Total: <strong style="color:var(--text)">${totalGoals} G · ${totalAssists} A · ${totalGoals+totalAssists} PTS</strong>
      </div>
      <div class="hint" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);">
        Bank Roll: <strong style="color:var(--text)">$${(me.bankroll_cents/100).toFixed(2)}</strong>
      </div>
    </div>
    <div class="panel">
      <h3 style="margin-top:0;font-size:15px;color:var(--teal)">Next 7 Days</h3>
      ${upcoming.length ? upcoming.map(it=>{
        const myAssign = myLineAssignmentText(it.id, it);
        return `
        <div style="padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;" onclick="openGameLines('${it.id}','dashboard')">
          <div class="ice-date">${iceTimeLabel(it)}</div>
          <div class="ice-loc">${it.time_label}</div>
          ${myAssign ? `<div class="hint" style="color:var(--teal);font-weight:600;margin-top:2px;">You: ${myAssign}</div>` : `<div class="hint" style="text-decoration:underline;margin-top:2px;">View Lines</div>`}
        </div>`;
      }).join('') : '<div class="empty">No games in the next 7 days.</div>'}
    </div>
  </div>`;
}

/* ---------- ICE TIMES ---------- */
function positionBreakdown(it){
  const forGame = signups.filter(x=>x.ice_time_id===it.id);
  const cap = (group)=>{
    if(group==='forward') return (it.fwd_lines||0)*6;
    if(group==='defense') return (it.def_pairs||0)*4;
    return (it.goalies||0)*2;
  };
  const filled = (group)=> forGame.filter(x=>x.position_group===group).length;
  return {
    forward: { filled: filled('forward'), cap: cap('forward') },
    defense: { filled: filled('defense'), cap: cap('defense') },
    goalie: { filled: filled('goalie'), cap: cap('goalie') },
  };
}
const ICE_TIME_STATUS = {
  needs:   { label:'Needs Players', color:'#e05a5a' },
  almost:  { label:'Almost Full',   color:'#e0b23a' },
  booked:  { label:'Booked ✓',      color:'#4fd18a' },
};
function iceTimeStatus(it, filledCount){
  if(it.booked) return ICE_TIME_STATUS.booked;
  if(filledCount>=16) return ICE_TIME_STATUS.almost;
  return ICE_TIME_STATUS.needs;
}

/* ---------- LINES ---------- */
const GAME_FORMATS = {
  default: { label:'Default — 10 skaters + 1 goalie per side (2 lines, 2 D-pairs)', fwd_lines:2, def_pairs:2, goalies:1 },
  max:     { label:'Max — 15 skaters + 1 goalie per side (3 lines, 3 D-pairs)', fwd_lines:3, def_pairs:3, goalies:1 },
};
function buildSlotDefs(game){
  const lines_n = game.fwd_lines || 2, pairs_n = game.def_pairs || 2, goalies_n = game.goalies || 1;
  const defs = [];
  for(let i=1;i<=lines_n;i++){
    defs.push({ grp: i===1 ? 'Forward Lines' : null, slots:[[`L${i}_LW`,'LW'],[`L${i}_C`,'C'],[`L${i}_RW`,'RW']] });
  }
  for(let i=1;i<=pairs_n;i++){
    defs.push({ grp: i===1 ? 'Defense Pairs' : null, slots:[[`D${i}_LD`,'LD'],[`D${i}_RD`,'RD']] });
  }
  const goalieSlots = [];
  for(let i=1;i<=goalies_n;i++) goalieSlots.push([`G${i}`, goalies_n>1?`G${i}`:'G']);
  defs.push({ grp:'Goalies', slots:goalieSlots });
  return defs;
}
function iceTimeLabel(it){ return `${it.date_label} — ${it.location}`; }

/* Lines are reached by drilling into one specific game (Dashboard, Ice Times, or the
   commissioner's Post Ice Time list) rather than via a standalone nav tab. */
let linesBackTab = 'icetimes'; // which real tab the "← Back" button on the lines page returns to
async function openGameLines(gameId, backTab){
  activeGameId = gameId;
  linesBackTab = backTab || (role==='admin' ? 'postice' : 'icetimes');
  await loadLines(gameId);
  activeTab = 'gamelines';
  renderTabs(tabsForRole(role));
  closeTabMenu();
  render();
}
const POS_FULL = { LW:'Left Wing', C:'Center', RW:'Right Wing', LD:'Left Defense', RD:'Right Defense', G:'Goalie' };
function describeSlot(slotKey){
  let m = slotKey.match(/^L(\d+)_(\w+)$/);
  if(m) return `Line ${m[1]} — ${POS_FULL[m[2]]||m[2]}`;
  m = slotKey.match(/^D(\d+)_(\w+)$/);
  if(m) return `Pair ${m[1]} — ${POS_FULL[m[2]]||m[2]}`;
  m = slotKey.match(/^G(\d*)$/);
  if(m) return m[1] ? `Goalie ${m[1]}` : 'Goalie';
  return slotKey;
}
function myLineAssignmentText(gameId, game){
  const a = myLines[gameId];
  if(!a) return null;
  const teamName = a.team==='A' ? (game.team_a_name||'Team Light') : (game.team_b_name||'Team Dark');
  return `${describeSlot(a.slot_key)} — ${teamName}`;
}

function renderGameLines(){
  const editable = role==='admin' && me.is_commissioner;
  const title = 'Game Lines — ' + activeLeague;
  const sub = editable ? `Assign players to each slot, for both teams, for this ${activeLeague} ice time.` : `Lines set by the commissioner for this ${activeLeague} ice time — both teams.`;
  const backBtn = `<button class="btn ghost small" style="margin-bottom:14px;" onclick="goTab('${linesBackTab}')">← Back</button>`;
  if(!iceTimes.length){
    return `${backBtn}<h2 class="section-title">${title}</h2><p class="section-sub">${sub}</p>
    <div class="empty">No ice times posted yet.${editable ? ' Post one from the "Post Ice Time" tab — it shows up here automatically.' : ''}</div>`;
  }
  const game = iceTimes.find(g=>g.id===activeGameId) || iceTimes[0];
  const opts = iceTimes.map(g=>`<option value="${g.id}" ${g.id===activeGameId?'selected':''}>${iceTimeLabel(g)}</option>`).join('');
  const skaterCap = (game.fwd_lines||2)*3 + (game.def_pairs||2)*2;
  const goalieCap = game.goalies||1;
  const defs = buildSlotDefs(game);
  const myAssignment = myLineAssignmentText(game.id, game);
  const signedUpIds = new Set(signups.filter(x=>x.ice_time_id===game.id).map(x=>x.user_id));
  const eligiblePlayers = activeRoster().filter(r=>signedUpIds.has(r.id));

  const teamColumn = (teamKey, teamLabel, teamNameField)=>{
    const teamLines = lines.filter(l=>l.team===teamKey);
    const lineup = (slotKey)=>{ const row = teamLines.find(l=>l.slot_key===slotKey); return row ? row.player_id : null; };
    const skaterCount = teamLines.filter(l=>!l.slot_key.startsWith('G') && l.player_id).length;
    const goalieCount = teamLines.filter(l=>l.slot_key.startsWith('G') && l.player_id).length;
    const slotHTML = (slotKey,label)=>{
      const pid = lineup(slotKey);
      const p = pid ? playerById(pid) : null;
      const mine = pid===me.id;
      if(editable){
        // Only players signed up for this game are selectable, so lines can't be stacked
        // with people who never claimed a spot. If someone is already slotted in but was
        // later removed from the signup list, keep showing them so their assignment
        // doesn't silently vanish out from under the dropdown.
        const optionsPool = eligiblePlayers.slice();
        if(pid && !optionsPool.some(r=>r.id===pid)){
          const cur = playerById(pid);
          if(cur) optionsPool.push(cur);
        }
        const options = optionsPool.map(r=>`<option value="${r.id}" ${r.id===pid?'selected':''}>${r.name}${r.claimed?'':' (pending)'}</option>`).join('');
        return `<div class="slot"><div class="pos-lbl">${label}</div>
          <select onchange="setLineSlot('${teamKey}','${slotKey}',this.value)"><option value="">— empty —</option>${options}</select></div>`;
      }
      const canRate = p && p.id!==me.id;

async function autoFillLines(){
  const game = iceTimes.find(g=>g.id===activeGameId);
  if(!game) return;
  if(!confirm('Auto-fill lines from signed-up players, balanced by skill and position? This overwrites any lines already set for this game.')) return;

  const skillNum = (p)=> (p && skillLevelOrder(p.skill_level)) || 2; // unset skill treated as mid-tier
  const pool = (group)=> signups.filter(x=>x.ice_time_id===activeGameId && x.position_group===group)
    .map(x=>playerById(x.user_id))
    .filter(Boolean)
    .sort((a,b)=> skillNum(b)-skillNum(a));

  // Greedily split a skill-sorted pool into two teams, always adding the next player
  // to whichever team currently has the lower running skill total — keeps both sides even.
  function splitBalanced(list){
    let totalA=0, totalB=0;
    const a=[], b=[];
    list.forEach(p=>{
      if(totalA<=totalB){ a.push(p); totalA+=skillNum(p); }
      else { b.push(p); totalB+=skillNum(p); }
    });
    return { a, b };
  }
  // Fill slot keys, preferring each player's own preferred position where possible.
  function assignToSlots(players, slotDefs){
    const remaining = [...players];
    const assignment = {};
    slotDefs.forEach(([slotKey,posLabel])=>{
      const idx = remaining.findIndex(p=>(p.positions||[]).includes(posLabel));
      if(idx>-1) assignment[slotKey] = remaining.splice(idx,1)[0];
    });
    slotDefs.forEach(([slotKey])=>{
      if(!assignment[slotKey] && remaining.length) assignment[slotKey] = remaining.shift();
    });
    return assignment;
  }
  function assignGoalies(players, slotKeys){
    const assignment = {};
    slotKeys.forEach((key,i)=>{ if(players[i]) assignment[key] = players[i]; });
    return assignment;
  }

  const linesN = game.fwd_lines||2, pairsN = game.def_pairs||2, goaliesN = game.goalies||1;
  const fwdSlotKeys = [];
  for(let i=1;i<=linesN;i++) fwdSlotKeys.push([`L${i}_LW`,'LW'],[`L${i}_C`,'C'],[`L${i}_RW`,'RW']);
  const defSlotKeys = [];
  for(let i=1;i<=pairsN;i++) defSlotKeys.push([`D${i}_LD`,'LD'],[`D${i}_RD`,'RD']);
  const goalieSlotKeys = [];
  for(let i=1;i<=goaliesN;i++) goalieSlotKeys.push(`G${i}`);

  const fwdSplit = splitBalanced(pool('forward'));
  const defSplit = splitBalanced(pool('defense'));
  const goalieSplit = splitBalanced(pool('goalie'));

  const rows = [];
  const pushRows = (assignment, team)=>{
    Object.entries(assignment).forEach(([slotKey, p])=>{
      rows.push({ game_id: activeGameId, team, slot_key: slotKey, player_id: p.id });
    });
  };
  pushRows(assignToSlots(fwdSplit.a, fwdSlotKeys), 'A');
  pushRows(assignToSlots(fwdSplit.b, fwdSlotKeys), 'B');
  pushRows(assignToSlots(defSplit.a, defSlotKeys), 'A');
  pushRows(assignToSlots(defSplit.b, defSlotKeys), 'B');
  pushRows(assignGoalies(goalieSplit.a, goalieSlotKeys), 'A');
  pushRows(assignGoalies(goalieSplit.b, goalieSlotKeys), 'B');

  await sb.from('game_lines').delete().eq('game_id', activeGameId);
  if(rows.length){
    const { error } = await sb.from('game_lines').insert(rows);
    if(error){ showToast('Failed: '+error.message); return; }
  }
  await loadLines(activeGameId);
  await loadMyLineAssignments();
  render();
  showToast(rows.length ? 'Lines auto-filled ✓ — adjust any slot by hand if needed.' : 'No signed-up players to fill lines with yet.');
}

// Takes a File straight from an <input type=file>, reads its bytes into memory right away,
// and uploads that in-memory copy instead of the live File reference. On some mobile browsers
// (notably Android WebView) the picked file's underlying data can become unreadable by the time
// an async upload call actually gets around to serializing it, which surfaces as a Supabase
// Storage "No content provided" error even though the picker showed a valid file. Reading the
// bytes immediately, before any other work, avoids that race.
async function uploadListingImage(file){
  if(!file) return null;
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
  const path = `${me.id}/${Date.now()}.${ext}`;
  let payload = file;
  try{
    const buf = await file.arrayBuffer();
    if(buf && buf.byteLength) payload = new Blob([buf], { type: file.type || 'application/octet-stream' });
  }catch(e){ /* fall back to the raw File if this browser can't read it this way */ }
  const { error } = await sb.storage.from('listing-images').upload(path, payload, { upsert: true, contentType: file.type || undefined });
  if(error){ showToast('Image upload failed: '+error.message); return null; }
  const { data } = sb.storage.from('listing-images').getPublicUrl(path);
  return data ? data.publicUrl : null;
}

async function markListingSold(id, location, title, listingOwnerId){
  const msg = `Mark "${title}" as sold? A 5% commission will be automatically deducted from the seller's bank roll.`;
  if(!confirm(msg)) return;
  const { data, error } = await sb.rpc('mark_listing_sold', { p_listing_id: id, p_location: 'on_app' });
  if(error){ showToast('Failed: '+error.message); return; }
  if(data && data.commission_cents){
    showToast(`Marked sold ✓ — $${(data.commission_cents/100).toFixed(2)} commission deducted from bank roll`);
  } else {
    showToast('Marked sold ✓');
  }
  if(listingOwnerId===me.id){
    const { data: freshMe } = await sb.from('profiles').select('bankroll_cents').eq('id', me.id).single();
    if(freshMe) me.bankroll_cents = freshMe.bankroll_cents;
  }
  await loadListings();
  await loadRoster();
  render();
}

  const { error } = await sb.from('chat_messages').insert({ league_id: activeLeague, user_id: me.id, body });

  newChatBody = '';
  await loadChat();

  const now = new Date();
  const recipients = rosterForLeague(roster)
    .filter(p=> p.id!==me.id && !(p.chat_muted_until && new Date(p.chat_muted_until) > now))
    .map(p=>p.id);
  if(recipients.length){
    callAdmin('send-push', { message: body, title: `${leagueName()} Chat — ${me.name||'A player'}`, user_ids: recipients }).catch(()=>{});
  }

function arenaAggregate(){
  const counts = {}, firstCounts = {};
  arenas.forEach(a=>{ counts[a.id]=0; firstCounts[a.id]=0; });
  roster.forEach(p=>{
    const list = (p.preferred_arenas && p.preferred_arenas[activeLeague]) || [];
    list.forEach((id,idx)=>{
      if(counts[id]!==undefined){ counts[id]++; if(idx===0) firstCounts[id]++; }
    });
  });
  return arenas.map(a=>({ arena:a, count:counts[a.id]||0, firstCount:firstCounts[a.id]||0 }))
    .sort((a,b)=> b.count-a.count);
}
function arenaAggregateHTML(){
  const rows = arenaAggregate();
  if(!rows.length) return '';
  const maxCount = Math.max(1, ...rows.map(r=>r.count));
  return `<div class="panel" style="margin-bottom:16px;">
    <h3 style="margin-top:0;font-size:15px;color:var(--teal)">Arena Preferences</h3>
    <p class="hint" style="margin-bottom:12px;">How players rank each arena — use this to help decide where to book.</p>
    ${rows.map(r=>`
      <div style="margin-bottom:10px;">
        <div class="row-flex" style="margin-bottom:2px;">
          <strong>${r.arena.name}</strong><span class="hint">${r.count} player${r.count===1?'':'s'} · ${r.firstCount} #1 pick${r.firstCount===1?'':'s'}</span>
        </div>
        <div class="spots-bar"><div class="spots-fill" style="width:${Math.round(r.count/maxCount*100)}%"></div></div>
      </div>`).join('')}
  </div>`;
}

function formatDateLabel(dateStr){
  if(!dateStr) return 'TBD';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
}
function toggleGoalieRankReq(btn){
  const wrap = document.getElementById('goalieRankWrap');
  const showing = wrap.style.display !== 'none';
  wrap.style.display = showing ? 'none' : 'flex';
  btn.classList.toggle('on', !showing);
}
async function postIce(){
  const game_date = document.getElementById('newDate').value;
  if(!game_date){ showToast('Pick a date first'); return; }
  const date_label = formatDateLabel(game_date);
  const time_label = document.getElementById('newTime').value || 'TBD';
  const location = document.getElementById('newLoc').value;
  const max_spots = Number(document.getElementById('newMax').value)||22;
  const formatKey = document.getElementById('newFormat').value;
  const fmt = GAME_FORMATS[formatKey] || GAME_FORMATS.default;
  const ref_status = document.getElementById('newRefStatus').value;
  const refBudgetEl = document.getElementById('newRefBudget');
  const ref_budget_cents = (ref_status!=='none' && refBudgetEl && refBudgetEl.value !== '') ? Math.round(Number(refBudgetEl.value)*100) : null;
  const goalie_status = document.getElementById('newGoalieStatus').value;
  const goalieBudgetEl = document.getElementById('newGoalieBudget');
  const goalie_budget_cents = (goalie_status!=='none' && goalieBudgetEl && goalieBudgetEl.value !== '') ? Math.round(Number(goalieBudgetEl.value)*100) : null;
  const goalie_count = Number(document.getElementById('newGoalieCount').value) || 1;
  const goalie_gender_pref = document.getElementById('newGoalieGenderPref').value || null;
  const goalie_caliber = document.getElementById('newGoalieCaliber').value || null;
  const rankWrap = document.getElementById('goalieRankWrap');
  const rankOn = rankWrap && rankWrap.style.display !== 'none';
  const rankMinEl = document.getElementById('newGoalieRankMin');
  const rankMaxEl = document.getElementById('newGoalieRankMax');
  const goalie_min_skill_level = (rankOn && rankMinEl.value !== '') ? rankMinEl.value : null;
  const goalie_max_skill_level = (rankOn && rankMaxEl.value !== '') ? rankMaxEl.value : null;
  const costEl = document.getElementById('newCost');
  const cost_cents = (costEl && costEl.value !== '') ? Math.round(Number(costEl.value)*100) : null;
  const min_skill_level = document.getElementById('newMinSkill').value || null;
  const max_skill_level = document.getElementById('newMaxSkill').value || null;
  const visibilityEl = document.getElementById('newVisibility');
  const visibility = (hasProAccess() && visibilityEl) ? visibilityEl.value : 'private';
  const payload = {
    date_label, game_date, time_label, location, max_spots, cost_cents, min_skill_level, max_skill_level,
    fwd_lines: fmt.fwd_lines, def_pairs: fmt.def_pairs, goalies: fmt.goalies, ref_status, ref_budget_cents,
    goalie_status, goalie_budget_cents, goalie_count, goalie_gender_pref, goalie_caliber, goalie_min_skill_level, goalie_max_skill_level,
    visibility,
  };
  if(editingGameId){
    const { error } = await sb.from('ice_times').update(payload).eq('id', editingGameId);
    if(error){ showToast('Failed: '+error.message); return; }
    showToast('Ice time updated ✓');
    editingGameId = null;
  } else {
    const { error } = await sb.from('ice_times').insert({ ...payload, league_id:activeLeague });
    if(error){ showToast('Failed: '+error.message); return; }
    showToast('Ice time posted ✓ — ready in Set Lines');
  }
  await loadIceTimes();
  render();
}
async function deleteIceTime(id, label){
  if(!confirm(`Delete ice time "${label}"? This also removes all player sign-ups and any lines set for it.`)) return;
  const { error } = await sb.from('ice_times').delete().eq('id', id);
  if(error){ showToast('Failed: '+error.message); return; }
  if(activeGameId === id) activeGameId = null;
  showToast('Ice time deleted ✓');
  await loadIceTimes();
  render();
}
async function removePlayerFromGame(iceTimeId, userId, playerName, isBooked){
  const refundNote = isBooked ? ' Their charge for this session refunds automatically.' : '';
  if(!confirm(`Remove ${playerName} from this game?${refundNote} The next Free Agent gets picked up automatically.`)) return;
  const { data, error } = await sb.rpc('remove_player_from_ice_time', { p_ice_time_id: iceTimeId, p_user_id: userId });
  if(error){ showToast('Failed: '+error.message); return; }
  showToast(`${playerName} removed ✓`);
  if(data && data.promoted_user_id){
    callAdmin('notify-waitlist-promotion', { ice_time_id: iceTimeId, user_id: data.promoted_user_id }).catch(()=>{});
  }
  await loadIceTimes();
  render();
}

function renderSetStats(){
  if(!iceTimes.length){
    return `<h2 class="section-title">Set Stats — ${activeLeague}</h2>
    <p class="section-sub">Log goals and assists per player for each ${activeLeague} game.</p>
    <div class="empty">No ice times posted yet.</div>`;
  }

  const opts = iceTimes.map(g=>`<option value="${g.id}" ${g.id===game.id?'selected':''}>${iceTimeLabel(g)}</option>`).join('');
  const statFor = (pid)=> allStats.find(s=>s.game_id===game.id && s.player_id===pid) || { goals:0, assists:0 };
  const rows = activeRoster().map(p=>{
    const s = statFor(p.id);
    return `<tr>
      <td>${p.name}</td>
      <td><input type="number" min="0" style="width:64px;" value="${s.goals}" onchange="setStat('${game.id}','${p.id}','goals',this.value)"></td>

      <td>${(s.goals||s.assists) ? `<button class="btn ghost small" onclick="removeStat('${game.id}','${p.id}','${p.name.replace(/'/g,"\\'")}')">Remove</button>` : ''}</td>
    </tr>`;
  }).join('');
  return `

  <div class="field" style="max-width:320px;"><select onchange="activeStatsGameId=this.value;render()">${opts}</select></div>

  <table>
    <tr><th>Player</th><th>Goals</th><th>Assists</th><th></th></tr>
    ${rows}
  </table>
  </div>`;
}
async function setStat(gameId, playerId, field, val){
  const n = Math.max(0, Number(val)||0);
  const existing = allStats.find(s=>s.game_id===gameId && s.player_id===playerId);
  const payload = { game_id:gameId, player_id:playerId, goals: existing?existing.goals:0, assists: existing?existing.assists:0 };
  payload[field] = n;
  const { error } = await sb.from('game_stats').upsert(payload, { onConflict:'game_id,player_id' });
  if(error){ showToast('Failed: '+error.message); return; }
  await loadStats();
  render();
  showToast('Stat updated ✓');
}
async function removeStat(gameId, playerId, playerName){
  if(!confirm(`Remove ${playerName}'s stats for this game?`)) return;
  const { error } = await sb.from('game_stats').delete().eq('game_id', gameId).eq('player_id', playerId);
  if(error){ showToast('Failed: '+error.message); return; }
  await loadStats();
  render();
  showToast('Stat removed ✓');
}

/* ---------- ADMIN: ROSTER ---------- */
function availabilitySummary(p){
  const av = p.availability || {};
  const days = DAYS.filter(d=>av[d]!==undefined);
  if(!days.length) return '<span class="hint">—</span>';
  return `<div class="hint">${days.map(d=> av[d] ? `${d} ${av[d]}` : d).join(', ')}</div>`;
}
function availabilityAggregate(list){
  const counts = {}; const times = {};
  DAYS.forEach(d=>{ counts[d]=0; times[d]=[]; });
  (list || roster).forEach(p=>{
    const av = p.availability || {};
    DAYS.forEach(d=>{
      if(av[d]!==undefined){
        counts[d]++;
        if(av[d]) times[d].push(av[d]);
      }
    });
  });
  return DAYS.map(d=>({ day:d, count:counts[d], times:times[d] }));
}
function activeRoster(){ return roster.filter(p=>!p.archived_at); }
function rosterForLeague(list){
  if(rosterShowAllLeagues && isGlobalCommish()) return list;
  return list.filter(p=> (p.leagues||[]).includes(activeLeague));
}
function isOnVacation(p, dateStr){
  const list = p.vacations || [];
  const d = dateStr || new Date().toISOString().slice(0,10);
  return list.some(v=> v.start && v.end && v.start<=d && d<=v.end);
}
function vacationSummary(p){
  const list = p.vacations || [];
  if(!list.length) return '<span class="hint">—</span>';
  return list.map(v=>`<div class="hint">${v.start||'?'} → ${v.end||'?'}</div>`).join('');
}
function gamesPlayed(p){ return signups.filter(s=>s.user_id===p.id).length; }
function calcAge(birthdate){
  if(!birthdate) return null;
  const b = new Date(birthdate+'T00:00:00');
  const now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  const m = now.getMonth() - b.getMonth();
  if(m < 0 || (m===0 && now.getDate() < b.getDate())) age--;
  return age;
}
function daysUntilArchive(p){
  if(!p.inactive_flagged_at) return null;
  const flagged = new Date(p.inactive_flagged_at);
  const deadline = new Date(flagged.getTime() + 30*24*60*60*1000);
  const now = new Date();
  return Math.max(0, Math.ceil((deadline-now)/(24*60*60*1000)));
}
function sortedRoster(list){
  const arr = [...list];
  if(rosterSort==='rank') arr.sort((a,b)=> skillLevelOrder(b.skill_level)-skillLevelOrder(a.skill_level));
  else if(rosterSort==='games') arr.sort((a,b)=> gamesPlayed(b)-gamesPlayed(a));
  else if(rosterSort==='age'){
    arr.sort((a,b)=>{
      const ageA = calcAge(a.birthdate), ageB = calcAge(b.birthdate);
      if(ageA===null && ageB===null) return 0;
      if(ageA===null) return 1;
      if(ageB===null) return -1;
      return ageB-ageA;
    });
  } else if(rosterSort==='gender'){
    arr.sort((a,b)=> (a.gender||'').localeCompare(b.gender||'') || a.name.localeCompare(b.name));
  } else if(rosterSort==='league'){
    arr.sort((a,b)=> ((a.leagues||[])[0]||'').localeCompare((b.leagues||[])[0]||'') || a.name.localeCompare(b.name));
  } else arr.sort((a,b)=> a.name.localeCompare(b.name));
  return arr;
}
function availabilitySummaryHTML(list){
  const rows = availabilityAggregate(list);
  const maxCount = Math.max(1, ...rows.map(r=>r.count));
  return `<div class="panel" style="margin-bottom:16px;">
    <h3 style="margin-top:0;font-size:15px;color:var(--teal)">Player Availability</h3>
    <p class="hint" style="margin-bottom:12px;">How many players prefer each day, from their profiles — use this to help decide when to book ice.</p>
    ${rows.map(r=>`
      <div style="margin-bottom:10px;">
        <div class="row-flex" style="margin-bottom:2px;">
          <strong>${r.day}</strong><span class="hint">${r.count} player${r.count===1?'':'s'}</span>
        </div>
        <div class="spots-bar"><div class="spots-fill" style="width:${Math.round(r.count/maxCount*100)}%"></div></div>
        ${r.times.length ? `<div class="hint" style="margin-top:4px;">Times mentioned: ${r.times.join(', ')}</div>` : ''}
      </div>`).join('')}
  </div>`;
}
function renderRoster(){

async function openEditPlayer(id){
  const p = roster.find(r=>r.id===id);
  if(!p) return;
  editingPlayerId = id;
  editPlayerReviews = [];
  loadPlayerReviewsFor(id).then(render);
  editingDraft = {
    name: p.name || '',
    birthdate: p.birthdate || null,
    gender: p.gender || null,
    skill_level: p.skill_level || null,
    bankroll_cents: p.bankroll_cents || 0,
    contact_phone: p.contact_phone || '',
    contact_email: p.contact_email || '',
    positions: [...(p.positions||[])],
    leagues: [...(p.leagues||[])],
    availability: { ...(p.availability||{}) },
    injury_status: p.injury_status || 'green',
    vacations: (p.vacations||[]).map(v=>({...v})),
    preferred_arenas: JSON.parse(JSON.stringify(p.preferred_arenas||{})),
  };
  render();
}
function closeEditPlayer(){
  editingPlayerId = null;
  editingDraft = null;
  render();
}
function epTogglePos(pos){
  const i = editingDraft.positions.indexOf(pos);
  if(i>-1) editingDraft.positions.splice(i,1); else editingDraft.positions.push(pos);
  render();
}
function epToggleLeague(code){
  const list = [...(editingDraft.leagues||[])];
  const i = list.indexOf(code);
  if(i>-1) list.splice(i,1); else list.push(code);
  editingDraft.leagues = list;
  render();
}
function epChooseSkillLevel(code){
  editingDraft.skill_level = code;
  render();
}
function epResetSkillLevel(){
  editingDraft.skill_level = null;
  render();
}
function epToggleDay(d){
  if(editingDraft.availability[d] !== undefined){
    const { [d]: _drop, ...rest } = editingDraft.availability;
    editingDraft.availability = rest;
  } else {
    editingDraft.availability = { ...editingDraft.availability, [d]: '' };
  }
  render();
}
function epUpdateDayTime(d, val){
  editingDraft.availability[d] = val;
}
function epAddVacation(){
  const todayStr = new Date().toISOString().slice(0,10);
  editingDraft.vacations = [...(editingDraft.vacations||[]), { start: todayStr, end: todayStr }];
  render();
}
function epRemoveVacation(idx){
  editingDraft.vacations = (editingDraft.vacations||[]).filter((_,i)=>i!==idx);
  render();
}
function epUpdateVacation(idx, field, val){
  const list = [...(editingDraft.vacations||[])];
  list[idx] = { ...list[idx], [field]: val || null };
  editingDraft.vacations = list;
}
function epArenaPrefList(){ return (editingDraft.preferred_arenas && editingDraft.preferred_arenas[activeLeague]) || []; }
function epToggleArenaPref(id){
  const cur = { ...(editingDraft.preferred_arenas||{}) };
  const list = [...(cur[activeLeague]||[])];
  const idx = list.indexOf(id);
  if(idx>-1) list.splice(idx,1);
  else {
    if(list.length>=5){ showToast('You can rank up to 5 arenas'); return; }
    list.push(id);
  }
  cur[activeLeague] = list;
  editingDraft.preferred_arenas = cur;
  render();
}
async function saveEditPlayer(){
  if(!editingDraft || !editingPlayerId) return;
  const nameEl = document.getElementById('epName');
  if(nameEl) editingDraft.name = nameEl.value || editingDraft.name;
  const phoneEl = document.getElementById('epPhone');
  if(phoneEl) editingDraft.contact_phone = phoneEl.value;
  const contactEmailEl = document.getElementById('epContactEmail');
  if(contactEmailEl) editingDraft.contact_email = contactEmailEl.value;
  const bankrollEl = document.getElementById('epBankroll');
  const bankroll_cents = bankrollEl ? (Math.round(Number(bankrollEl.value)*100) || 0) : editingDraft.bankroll_cents;
  const { error } = await sb.from('profiles').update({
    name: editingDraft.name, positions: editingDraft.positions,
    availability: editingDraft.availability, birthdate: editingDraft.birthdate,
    vacations: editingDraft.vacations, gender: editingDraft.gender,
    injury_status: editingDraft.injury_status, preferred_arenas: editingDraft.preferred_arenas,
    leagues: editingDraft.leagues,
    skill_level: editingDraft.skill_level, skill_level_locked: !!editingDraft.skill_level,
    bankroll_cents, contact_phone: editingDraft.contact_phone, contact_email: editingDraft.contact_email,
  }).eq('id', editingPlayerId);
  if(error){ showToast('Save failed: '+error.message); return; }
  showToast('Player profile saved ✓');
  editingPlayerId = null;
  editingDraft = null;
  await loadRoster();
  render();
}

async function addPlayer(){
  const name = document.getElementById('newPlayerName').value.trim();
  if(!name){ showToast('Enter a name first'); return; }
  const result = await callAdmin('add-player', { name });
  if(result.error){ showToast('Failed: '+result.error); return; }
  showToast('Player added — pending until they set a password ✓');
  await loadRoster();
  render();
}
async function promoteToggle(id, makeCommish){
  const { error } = await sb.from('profiles').update({ is_commissioner: makeCommish }).eq('id', id);
  if(error){ showToast('Failed: '+error.message); return; }
  showToast(makeCommish ? 'Promoted to commissioner ✓' : 'Commissioner removed');
  await loadRoster();
  render();
}
async function updatePlayerSkillLevel(id, val){
  const { error } = await sb.from('profiles').update({ skill_level: val || null, skill_level_locked: !!val }).eq('id', id);
  if(error){ showToast('Failed: '+error.message); return; }
  await loadRoster();
  showToast('Skill level updated ✓');
}
async function updatePlayerBankroll(id, val){
  const cents = Math.round(Number(val)*100) || 0;
  const { error } = await sb.from('profiles').update({ bankroll_cents: cents }).eq('id', id);
  if(error){ showToast('Failed: '+error.message); return; }
  await loadRoster();
  showToast('Bank roll updated ✓');
}
async function resetPassword(id, name){
  const pw = prompt(`New password for ${name}:`);
  if(!pw) return;
  const result = await callAdmin('reset-password', { target_user_id:id, new_password:pw });
  if(result.error){ showToast('Failed: '+result.error); return; }
  showToast('Password updated ✓');
}
async function flagInactive(id, name){
  if(!confirm(`Flag ${name} as inactive? If not cancelled, they'll be auto-archived in 30 days.`)) return;
  const { error } = await sb.from('profiles').update({ inactive_flagged_at: new Date().toISOString() }).eq('id', id);
  if(error){ showToast('Failed: '+error.message); return; }
  await loadRoster();
  render();
  showToast('Player flagged inactive — auto-archives in 30 days unless cancelled');
}
async function cancelInactiveFlag(id){
  const { error } = await sb.from('profiles').update({ inactive_flagged_at: null }).eq('id', id);
  if(error){ showToast('Failed: '+error.message); return; }
  await loadRoster();
  render();
  showToast('Inactive flag cancelled ✓');
}
async function reactivatePlayer(id){
  const { error } = await sb.from('profiles').update({ archived_at: null, inactive_flagged_at: null }).eq('id', id);
  if(error){ showToast('Failed: '+error.message); return; }
  await loadRoster();
  render();
  showToast('Player reactivated ✓');
}
async function deletePlayer(id, name){
  if(id===me.id){ showToast("You can't delete your own account."); return; }
  if(!confirm(`Permanently delete ${name}? This removes their account, profile, and all sign-ups/line assignments. This cannot be undone.`)) return;
  const result = await callAdmin('delete-player', { target_user_id:id });
  if(result.error){ showToast('Failed: '+result.error); return; }
  showToast('Player deleted ✓');
  await loadRoster();
  render();
}

async function loadPastGames(){
  const { data } = await sb.from('ice_times').select('*').eq('league_id', activeLeague).eq('archived', true).order('game_date', { ascending:false });
  pastGames = data || [];
}
async function loadPastGameLines(gameId){
  const { data } = await sb.from('game_lines').select('*').eq('game_id', gameId);
  pastLines = data || [];
}
async function openPastGames(){
  await loadPastGames();
  if(activePastGameId && !pastGames.find(g=>g.id===activePastGameId)) activePastGameId = null;
  if(pastGames.length && !activePastGameId) activePastGameId = pastGames[0].id;
  if(activePastGameId) await loadPastGameLines(activePastGameId);
  else pastLines = [];
  render();
}
async function selectPastGame(id){
  activePastGameId = id;
  await loadPastGameLines(id);
  render();
}
function renderPastGames(){
  if(!pastGames.length){
    return `<h2 class="section-title">Past Games — ${activeLeague}</h2>
