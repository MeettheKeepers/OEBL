    <div class="empty">No past games yet.</div>`;
  }
  const game = pastGames.find(g=>g.id===activePastGameId) || pastGames[0];
  const opts = pastGames.map(g=>`<option value="${g.id}" ${g.id===game.id?'selected':''}>${iceTimeLabel(g)} (${g.game_date})</option>`).join('');
  const gameStats = allStats.filter(s=>s.game_id===game.id);
  const statFor = (pid)=> gameStats.find(s=>s.player_id===pid);
  const teamGoals = (team)=> pastLines.filter(l=>l.team===team && l.player_id)
    .reduce((sum,l)=>{ const st = statFor(l.player_id); return sum + (st?st.goals:0); }, 0);
  const scoreA = teamGoals('A'), scoreB = teamGoals('B');
  const refName = game.referee_id ? (playerById(game.referee_id)?.name||'Assigned') : 'Not assigned';
  const teamPanel = (team, label)=>{
    const teamLines = pastLines.filter(l=>l.team===team && l.player_id);
    return `<div class="panel">
      <h3 style="margin-top:0;font-size:15px;">${label} — ${team==='A'?scoreA:scoreB}</h3>
      ${teamLines.length ? teamLines.map(l=>{
        const p = playerById(l.player_id);
        const st = statFor(l.player_id);
        return `<div class="row-flex" style="padding:6px 0;border-bottom:1px solid var(--line);">
          <span>${p?p.name:'Unknown'} <span class="hint">${l.slot_key}</span></span>
          <span class="hint">${st?`${st.goals}G ${st.assists}A`:'0G 0A'}</span>
        </div>`;
      }).join('') : '<div class="hint">No lines were set for this game.</div>'}
    </div>`;
  };
  return `
  <h2 class="section-title">Past Games — ${activeLeague}</h2>
  <p class="section-sub">${pastGames.length} past game${pastGames.length===1?'':'s'}. Games archive automatically the day after they're played.</p>
  <div class="field" style="max-width:360px;"><select onchange="selectPastGame(this.value)">${opts}</select></div>
  <div class="panel" style="margin:12px 0;">
    <div class="row-flex"><strong>${iceTimeLabel(game)}</strong><span class="hint">${game.game_date}</span></div>
    <div class="hint" style="margin-top:4px;">${game.time_label} · Referee: ${refName}${game.ref_budget_cents!=null?` · Budget: $${(game.ref_budget_cents/100).toFixed(0)}`:''}</div>
    <div style="font-family:'Anton',sans-serif;font-size:32px;margin-top:10px;color:var(--teal);">${game.team_a_name||'Team A'} ${scoreA} – ${scoreB} ${game.team_b_name||'Team B'}</div>
  </div>
  <div class="grid cols-2" style="align-items:start;">
    ${teamPanel('A', game.team_a_name||'Team Light')}
    ${teamPanel('B', game.team_b_name||'Team Dark')}
  </div>`;
}

/* ---------- ADMIN: MESSAGE PLAYERS ---------- */
function updateSearchFilter(field, val){ searchFilters = { ...searchFilters, [field]: val }; render(); }
function filteredPlayersForMessage(){
  return activeRoster().filter(p=>{
    if(searchFilters.name && !p.name.toLowerCase().includes(searchFilters.name.toLowerCase())) return false;
    const age = calcAge(p.birthdate);
    if(searchFilters.minAge!=='' && searchFilters.minAge!==null && (age===null || age < Number(searchFilters.minAge))) return false;
    if(searchFilters.maxAge!=='' && searchFilters.maxAge!==null && (age===null || age > Number(searchFilters.maxAge))) return false;
    if(searchFilters.minSkill!=='beginner' || searchFilters.maxSkill!=='advanced'){
      const lvl = skillLevelOrder(p.skill_level);
      if(!lvl || lvl < skillLevelOrder(searchFilters.minSkill) || lvl > skillLevelOrder(searchFilters.maxSkill)) return false;
    }
    if(searchFilters.position!=='any' && !(p.positions||[]).includes(searchFilters.position)) return false;
    if(searchFilters.status==='vacation' && !isOnVacation(p)) return false;
    if(searchFilters.status==='red' && p.injury_status!=='red') return false;
    if(searchFilters.status==='yellow' && p.injury_status!=='yellow') return false;
    if(searchFilters.status==='green' && (p.injury_status||'green')!=='green') return false;
    if(searchFilters.gender!=='any' && p.gender!==searchFilters.gender) return false;
    if(searchFilters.league!=='any' && !(p.leagues||[]).includes(searchFilters.league)) return false;
    return true;
  });
}
function toggleSelectPlayer(id){
  const i = selectedPlayerIds.indexOf(id);
  if(i>-1) selectedPlayerIds = selectedPlayerIds.filter(x=>x!==id);
  else selectedPlayerIds = [...selectedPlayerIds, id];
  render();
}
function selectAllFiltered(){
  selectedPlayerIds = filteredPlayersForMessage().map(p=>p.id);
  render();
}
function clearSelection(){ selectedPlayerIds = []; render(); }
function renderMessagePlayers(){
  const results = filteredPlayersForMessage();
  const targetCount = selectedPlayerIds.length || results.length;
  return `
  <h2 class="section-title">Player Finder &amp; Messaging — ${activeLeague}</h2>
  <p class="section-sub">Search the full roster by any combination of league, age, gender, skill rank, position, and status — e.g. "OEBL players, 30–45, Male, rank 5–7" — then message everyone matched or click specific players for a small group message.</p>
  <div class="panel grid cols-3" style="margin-bottom:16px;">
    <div class="field"><label>Name</label><input value="${searchFilters.name}" oninput="updateSearchFilter('name',this.value)" placeholder="Search name…"></div>
    <div class="field"><label>League</label><select onchange="updateSearchFilter('league',this.value)">
      <option value="any" ${searchFilters.league==='any'?'selected':''}>Any</option>
      ${LEAGUES.map(([code,name])=>`<option value="${code}" ${searchFilters.league===code?'selected':''}>${code} — ${name}</option>`).join('')}
    </select></div>
    <div class="field"><label>Gender</label><select onchange="updateSearchFilter('gender',this.value)">
      <option value="any" ${searchFilters.gender==='any'?'selected':''}>Any</option>
      ${GENDERS.map(g=>`<option value="${g}" ${searchFilters.gender===g?'selected':''}>${g}</option>`).join('')}
    </select></div>
    <div class="field"><label>Min Age</label><input type="number" value="${searchFilters.minAge}" oninput="updateSearchFilter('minAge',this.value)"></div>
    <div class="field"><label>Max Age</label><input type="number" value="${searchFilters.maxAge}" oninput="updateSearchFilter('maxAge',this.value)"></div>
    <div class="field"><label>Min Skill Level</label><select onchange="updateSearchFilter('minSkill',this.value)">
      ${SKILL_LEVELS.map(([code,label])=>`<option value="${code}" ${searchFilters.minSkill===code?'selected':''}>${label}</option>`).join('')}
    </select></div>
    <div class="field"><label>Max Skill Level</label><select onchange="updateSearchFilter('maxSkill',this.value)">
      ${SKILL_LEVELS.map(([code,label])=>`<option value="${code}" ${searchFilters.maxSkill===code?'selected':''}>${label}</option>`).join('')}
    </select></div>
    <div class="field"><label>Position</label><select onchange="updateSearchFilter('position',this.value)">
      <option value="any" ${searchFilters.position==='any'?'selected':''}>Any</option>
      ${POSITIONS.map(p=>`<option value="${p}" ${searchFilters.position===p?'selected':''}>${p}</option>`).join('')}
    </select></div>
    <div class="field"><label>Status</label><select onchange="updateSearchFilter('status',this.value)">
      <option value="any" ${searchFilters.status==='any'?'selected':''}>Any</option>
      <option value="vacation" ${searchFilters.status==='vacation'?'selected':''}>Currently On Vacation</option>
      <option value="red" ${searchFilters.status==='red'?'selected':''}>Injured — Can't Play</option>
      <option value="yellow" ${searchFilters.status==='yellow'?'selected':''}>Injured — Limited</option>
      <option value="green" ${searchFilters.status==='green'?'selected':''}>Healthy</option>
    </select></div>
  </div>
  <div class="row-flex" style="margin-bottom:12px;">
    <div class="hint">${results.length} player${results.length===1?'':'s'} matched · ${selectedPlayerIds.length} selected</div>
    <div style="display:flex;gap:8px;">
      <button class="btn ghost small" onclick="selectAllFiltered()">Select All Matched</button>
      <button class="btn ghost small" onclick="clearSelection()">Clear Selection</button>
    </div>
  </div>
  <div class="grid cols-3" style="margin-bottom:20px;">
    ${results.length ? results.map(p=>{
      const inj = INJURY[p.injury_status||'green'];
      const age = calcAge(p.birthdate);
      const unavailable = isOnVacation(p);
      const selected = selectedPlayerIds.includes(p.id);
      return `<div class="player-card ${selected?'selected':''} ${unavailable?'unavailable':''}" onclick="toggleSelectPlayer('${p.id}')">
        <div class="pc-name">${p.name}${unavailable?' <span class="tag" style="background:var(--danger);color:#fff;">UNAVAILABLE</span>':''}</div>
        <div class="pc-meta">${skillLevelLabel(p.skill_level)} · ${age!==null?age+' yrs':'age n/a'}</div>
        <div class="pc-meta" style="margin-top:6px;"><span class="tag" style="background:${inj.color};color:#04241a;">${(p.injury_status||'green').toUpperCase()}</span></div>
      </div>`;
    }).join('') : '<div class="empty">No players match these filters.</div>'}
  </div>
  <div class="panel">
    <h3 style="margin-top:0;font-size:15px;color:var(--teal)">Compose Message</h3>
    <div class="field"><textarea id="directMsg" rows="3" placeholder="e.g. Reminder to confirm your spot for Thursday's game"></textarea></div>
    <button class="btn purple" onclick="sendDirectMessage()">Send to ${targetCount} player${targetCount===1?'':'s'}</button>
    <div class="hint" style="margin-top:8px;">Sends a push notification only to the selected/matched players — not posted to the public Announcements board.</div>
  </div>`;
}
async function sendDirectMessage(){
  const el = document.getElementById('directMsg');
  const message = el.value.trim();
  if(!message){ showToast('Enter a message first'); return; }
  const recipients = selectedPlayerIds.length ? selectedPlayerIds : filteredPlayersForMessage().map(p=>p.id);
  if(!recipients.length){ showToast('No players match or are selected'); return; }
  const { error } = await sb.from('direct_messages').insert({
    league_id: activeLeague, sender_id: me.id, sender_name: me.name, recipient_ids: recipients, message,
  });
  if(error){ showToast('Failed: '+error.message); return; }
  showToast('Sending…');
  const result = await callAdmin('send-push', { message, title: 'OBL Hockey Message', user_ids: recipients });
  if(result.error){ showToast('Saved, but push failed: '+result.error); }
  else { showToast(`Sent to ${result.sent} device(s) ✓`); }
  el.value = '';
}

/* ================= INIT: resume existing session ================= */
(async function init(){
  const { data } = await sb.auth.getSession();
  if(data.session){ await enterApp(data.session); }
})();
</script>
</body>
